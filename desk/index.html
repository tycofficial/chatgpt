<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <base href="/chatgpt/">
  <title>TYC 对话台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="desk/desk.css?v=1">
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true">T</span><span>TYC <strong>对话台</strong></span></div>
      <div class="account"><span id="account-name">访客</span><button id="account-action" type="button" disabled>本站登录</button></div>
    </div>
  </header>
  <main class="desk">
    <section class="compose card" aria-labelledby="compose-title">
      <div class="section-head">
        <h1 id="compose-title">撰写消息</h1>
        <p id="connection" role="status">正在加载对话功能…</p>
      </div>
      <form id="composer">
        <div id="model-options" class="model-options" hidden>
          <label>模式<select id="mode"><option value="chat">聊天</option><option value="work">工作</option><option value="codex">Codex</option></select></label>
          <label>模型<select id="model"></select></label>
          <label>思考等级<select id="effort"></select></label>
        </div>
        <label class="visually-hidden" for="prompt">消息</label>
        <textarea id="prompt" placeholder="写下你的问题，或粘贴一张图片" rows="6" disabled></textarea>
        <input id="image-picker" type="file" accept="image/*" multiple hidden>
        <ul id="attachments" class="attachments" aria-label="图片附件"></ul>
        <div class="options">
          <button id="attach" type="button" disabled>添加图片</button>
          <label id="free-thinking"><input id="think" type="checkbox"> 深入思考</label>
          <label><input id="web-search" type="checkbox"> 网页搜索</label>
        </div>
        <p id="compose-status" class="status" aria-live="polite"></p>
        <div class="send-row">
          <button id="send" class="accent" type="submit" disabled>发送消息</button>
          <button id="stop" type="button" hidden>停止</button>
        </div>
      </form>
      <p id="storage-status" class="storage-status" role="status" hidden></p>
    </section>
    <section class="conversation card" aria-labelledby="conversation-title">
      <div class="conversation-head">
        <h2 id="conversation-title">对话记录</h2>
        <div class="history-actions">
          <label class="visually-hidden" for="history">选择对话</label>
          <select id="history" disabled><option value="">当前对话</option></select>
          <button id="new-chat" type="button" disabled>新对话</button>
        </div>
      </div>
      <div id="messages" class="messages" tabindex="0" aria-label="对话消息">
        <p class="empty">发送一条消息开始对话。</p>
      </div>
    </section>
  </main>
  <dialog id="sign-in" aria-labelledby="sign-in-title">
    <form id="account-form">
      <h2 id="sign-in-title">登录 TYC 对话台</h2>
      <label>本站用户名<input id="username" autocomplete="username" required></label>
      <label>本站密码<input id="password" autocomplete="current-password" type="password" required></label>
      <p id="account-error" class="status" role="status"></p>
      <div class="dialog-actions">
        <button id="close-account" type="button">取消</button>
        <button id="register" type="button">注册</button>
        <button id="login" class="accent" type="submit">登录</button>
      </div>
    </form>
  </dialog>
  <noscript>请启用 JavaScript 后打开 TYC 对话台。</noscript>
  <script type="module">
    import('./desk/desk.mjs?v=1').catch(() => {
      const status = document.getElementById('connection');
      status.textContent = '加载失败，请重试。';
      const retry = document.createElement('button');
      retry.type = 'button';
      retry.textContent = '重新加载';
      retry.addEventListener('click', () => location.reload());
      status.after(retry);
    });
  </script>
</body>
</html>
