name: Inspect the original personal pricing Go inputs
on:
  push:
    branches: [qa/native-go-card]
    paths: [.github/workflows/inspect-native-go-card.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: windows-2025
    timeout-minutes: 17
    defaults:
      run:
        shell: bash
    env:
      UPSTREAM: 0237c4dd9e54c7e3a619581b909d792de582fee9
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: chatgpt-public-interactions-single-graph
          path: ${{ runner.temp }}/chatgpt-candidate-archive
          github-token: ${{ github.token }}
          run-id: 45162484586
      - name: Unpack the already verified capture on this runner
        run: |
          set -euo pipefail
          task_tmp="$(cygpath -u "$RUNNER_TEMP")"
          mkdir -p "$task_tmp/chatgpt-upstream-capture"
          tar -C "$task_tmp/chatgpt-upstream-capture" -xzf "$task_tmp/chatgpt-candidate-archive/chatgpt-public-graph.tar.gz"
          npm ci --no-audit --no-fund
      - name: Report the personal pricing gate and native list input
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const {createHash} = require('node:crypto');
          const {parse} = require('acorn');
          const root = path.join(process.env.RUNNER_TEMP, 'chatgpt-upstream-capture', process.env.UPSTREAM);
          const capture = JSON.parse(fs.readFileSync(path.join(root, 'capture-manifest.json'), 'utf8'));
          assert.equal(capture.sourceBuild, process.env.UPSTREAM);
          const key = node => node?.name ?? node?.value;
          const fields = new Set(['showGo','isGoEnabled','alwaysVisiblePlans','expanded']);
          const fn = node => ['FunctionDeclaration','FunctionExpression','ArrowFunctionExpression'].includes(node.type);
          function walk(node, visit, parents = []) {
            if (!node || typeof node.type !== 'string') return;
            if (visit(node, parents) === false) return;
            const next = [...parents, node];
            for (const child of Object.values(node)) {
              if (Array.isArray(child)) for (const item of child) walk(item, visit, next);
              else walk(child, visit, next);
            }
          }
          for (const name of ['172692.0756eaf57c.js', '863505.f04df9e438.js']) {
            const assets = capture.assets.filter(asset => new URL(asset.url).pathname.split('/').at(-1) === name);
            assert.equal(assets.length, 1);
            const asset = assets[0], url = new URL(asset.url);
            assert.equal(asset.path, 'public/' + url.hostname + url.pathname);
            const bytes = fs.readFileSync(path.join(root, asset.path));
            assert.equal(createHash('sha256').update(bytes).digest('hex'), asset.sha256);
            const source = bytes.toString('utf8');
            const ast = parse(source, {ecmaVersion:'latest',sourceType:'module'});
            const small = (node, max = 220) => node ? source.slice(node.start,Math.min(node.end,node.start+max)) : null;
            const table = ast.body.flatMap(node => (node.declaration??node).declarations??[])
              .find(node => node.id.name === '__webpack_modules__').init;
            for (const {key: id, value: module} of table.properties) {
              const body = source.slice(module.start,module.end);
              if (!body.includes('isGoEnabled') && key(id)!=='Y0ov') continue;
              const aliases = new Map(), exports = [];
              for (const statement of module.body.body) {
                for (const init of statement.declarations??[]) {
                  const call = init.init;
                  if(call?.type==='CallExpression'&&call.callee.name===module.params[2].name&&typeof call.arguments[0]?.value==='string') aliases.set(init.id.name,call.arguments[0].value);
                }
                const call=statement.expression;
                if(call?.type==='CallExpression'&&call.callee.property?.name==='d'&&call.arguments[0]?.name===module.params[1].name) exports.push(...call.arguments.slice(1).map(arg=>small(arg,240)));
              }
              const inputRecords = [];
              walk(module,(node,parents)=>{
                const field=key(node.key), immediate=parents.at(-1);
                if(node.type!=='Property'||!fields.has(field)||!['ObjectPattern','ObjectExpression'].includes(immediate?.type)) return;
                const scope=parents.filter(fn).at(-1), context=parents.at(-3);
                if(!scope) return;
                const bindingNames = new Set();
                walk(node.value, term => {if(term.type==='Identifier') bindingNames.add(term.name);});
                const bindings = [];
                walk(scope, (term, ancestry)=>{
                  if(term!==scope&&fn(term))return false;
                  if(term.type==='VariableDeclarator'&&bindingNames.has(term.id.name))bindings.push({id:term.id.name,expr:small(term.init)});
                  if(term.type==='Property'&&ancestry.at(-1)?.type==='ObjectPattern'&&bindingNames.has(term.value.name))bindings.push({input:key(term.key),as:term.value.name});
                });
                const call=parents.findLast(item=>item.type==='CallExpression'), owner=scope.id?.name ?? null;
                inputRecords.push({field,kind:immediate.type,value:small(node.value,410),owner,ancestors:parents.slice(-5).map(p=>p.type),call:small(call?.callee,100),context:small(context,110),bindings});
              });
              walk(module,(term,ancestry)=>{
                if(term!==module&&fn(term))return false;
                if(term.type==='CallExpression'&&term.callee.property?.name==='d'&&term.arguments[0]?.name===module.params[1].name) {
                  for(const schema of term.arguments.slice(1)) if(!exports.includes(small(schema,240))) exports.push(small(schema,240));
                }
              });
              console.log('Go AST '+JSON.stringify({asset:url.pathname,module:key(id),exports,aliases:Object.fromEntries(aliases),inputs:inputRecords}));
            }
          }
          NODE
      - name: Build the isolated verification candidate
        run: |
          set -euo pipefail
          node scripts/adopt-native-upstream.mjs "$RUNNER_TEMP/chatgpt-upstream-capture/$UPSTREAM"
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'src/native-client/boot-adapter.mjs';
          const text = fs.readFileSync(file,'utf8');
          const mark = "return name === '3600660324' ? true : original;";
          if(text.split(mark).length!==2)throw Error('Missing verified Go gate');
          fs.writeFileSync(file,text.replace(mark,
            "if (name === '3600660324') (globalThis.__siteGoTrace ??= []).push(Boolean(original)); " + mark));
          NODE
          node scripts/build-native-client.mjs --activate
          npm run native:check
      - name: Open native personal pricing in synthetic Edge
        env:
          QA_BROWSER: edge
          QA_INSPECT_ENTRIES: '1'
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --no-audit --no-fund playwright-core@1.58.2
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const file = 'scripts/qa/domestic-startup-admin.mjs';
          const original = readFileSync(file, 'utf8');
          const anchor = "        await inspect('personal-pricing', () => goto('#pricing'), {go: /^Go$/, pro: /^Pro$/, dotBenefit: /含站内 Dot/});";
          if (original.split(anchor).length !== 2) throw Error('Unexpected pricing browser fixture');
          const check = [
            "        const personal = surfaces.at(-1);",
            "        const beforeControls = await page.getByRole('button').filter({visible:true}).allTextContents();",
            "        const plans = beforeControls.map(t=>t.trim()).filter(t=>/套餐|plan|compare|更多|更少/i.test(t)).slice(-20);",
            "        const flags = await page.evaluate(()=>window.__siteGoTrace??[]);",
            "        console.log('Native Go initial '+JSON.stringify({seen:personal.seen,plans,flags}));",
            "        let expandedInTest=false;",
            "        if(!personal.seen.go){",
            "          const more=page.getByRole('button',{name:/^(?:查看(?:所有|全部|更多|其他).*(?:套餐|方案|计划)|(?:查看)?全部套餐|(?:See|View|Show) (?:all|more).*plans)$/i}).filter({visible:true}).first();",
            "          if(await more.isVisible()){await more.click();expandedInTest=true;}",
            "        }",
            "        await page.getByText('Go',{exact:true}).filter({visible:true}).first().waitFor({state:'visible',timeout:10000});",
            "        assert.equal(personal.seen.pro,true);",
            "        assert.equal(personal.seen.dotBenefit,true);",
            "        const goAction = page.getByRole('button',{name:'查看官方 Go 套餐',exact:true}).filter({visible:true}).first();",
            "        await goAction.waitFor({state:'visible',timeout:10000});",
            "        const referenceCard = await goAction.evaluate(button=>{",
            "          for(let node=button.parentElement;node&&node!==document.body;node=node.parentElement){",
            "            const text=node.innerText??'';",
            "            if(text.split('\\n').some(line=>line.trim()==='Go')&&text.includes('美元参考价'))return text;",
            "          }",
            "          return '';",
            "        });",
            "        assert.match(referenceCard, /(?:US\\$|\\$)\\s*8(?:[.,]00)?\\b|8(?:[.,]00)?\\s*(?:USD|美元)/);",
            "        const offeredPlans = await page.evaluate(()=>['Free','Go','Plus','Pro'].filter(plan=>",
            "          [...document.querySelectorAll('h2,h3,h4,[role=heading]')].some(node=>node.textContent.trim()===plan&&node.getClientRects().length)));",
            "        console.log('Native Go QA '+JSON.stringify({release:active.release,openedWithoutExpanding:!expandedInTest,goReference:true,hasOfficialPriceAction:true,offeredPlans}));",
          ].join('\n');
          writeFileSync(file, original.replace(anchor, anchor+'\n'+check));
          NODE
          node scripts/qa/domestic-startup-admin.mjs
