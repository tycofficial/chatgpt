name: Verify the authenticated browser relay against official Codex
on:
  push:
    branches: [qa/official-codex-browser-relay]
permissions:
  contents: read
jobs:
  existing-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify the existing local bridge tests
        run: |
          npm install --prefix local-bridge --no-package-lock --ignore-scripts --no-audit --no-fund
          node --test local-bridge/test/*.test.mjs
  official-app-server:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install the pinned official Codex distribution and test browser
        run: |
          npm install --prefix "$RUNNER_TEMP/tyc-codex-qa" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @openai/codex@0.171.0 playwright@1.58.2
          "$RUNNER_TEMP/tyc-codex-qa/node_modules/.bin/playwright" install chromium --only-shell
          echo "$RUNNER_TEMP/tyc-codex-qa/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Send, reload and continue through Chromium and real Codex
        env:
          QA_CODEX_TEST_MODE: sandboxed-command
        run: |
          codex --version
          export QA_PLAYWRIGHT_MODULE="$RUNNER_TEMP/tyc-codex-qa/node_modules/playwright/index.mjs"
          node scripts/qa/official-codex-browser-relay.mjs
