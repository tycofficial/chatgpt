name: Trace the candidate's native settings registration
on:
  push:
    branches: [qa/weekly-upstream-0237c4dd]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: windows-2025
    timeout-minutes: 16
    defaults:
      run:
        shell: bash
    env:
      UPSTREAM: 0237c4dd9e54c7e3a619581b909d792de582fee9
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: chatgpt-verified-public-graph-0237c4dd
          path: ${{ runner.temp }}/chatgpt-candidate-archive
          github-token: ${{ github.token }}
          run-id: 45152117130
      - name: Unpack the already verified capture on this runner
        run: |
          set -euo pipefail
          task_tmp="$(cygpath -u "$RUNNER_TEMP")"
          mkdir -p "$task_tmp/chatgpt-upstream-capture"
          tar -C "$task_tmp/chatgpt-upstream-capture" -xzf "$task_tmp/chatgpt-candidate-archive/chatgpt-upstream.tar.gz"
          npm ci --no-audit --no-fund
      - name: Trace initialization and the exact settings service registration
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import { createHash } from 'node:crypto';
          import { parse } from 'acorn';
          import assert from 'node:assert/strict';
          const root=join(process.env.RUNNER_TEMP,'chatgpt-upstream-capture',process.env.UPSTREAM);
          const graph=JSON.parse(await readFile(join(root,'capture-manifest.json'),'utf8'));
          const row=graph.assets.find(a=>a.path==='public/chatgpt.com/cdn/assets/767086.d600a395f4.js');
          const bytes=await readFile(join(root,row.path));
          assert.equal(createHash('sha256').update(bytes).digest('hex'),row.sha256);
          const source=bytes.toString('utf8'), program=parse(source,{ecmaVersion:'latest',sourceType:'module'});
          const mods=program.body.flatMap(x=>(x.declaration??x).declarations??[])
            .find(x=>x.id.name==='__webpack_modules__').init.properties;
          const property=mods.find(p=>(p.key.name??p.key.value)==='IKem');
          const factory=property.value;
          function walk(node,visit){
            if(!node||typeof node!=='object')return;
            if(Array.isArray(node)){node.forEach(n=>walk(n,visit));return;}
            if(node.type)visit(node);
            for(const child of Object.values(node))if(child&&typeof child==='object')walk(child,visit);
          }
          const src=node=>node?source.slice(node.start,node.end):null;
          const require=factory.params[2].name;
          const statements=factory.body.body;
          const map=[];
          walk(factory,node=>{
            if (node.type==='NewExpression'&&node.callee.name==='X') map.push({method:'new X',surround:source.slice(node.start-160,node.end+220)});
            if (node.type==='CallExpression'&&node.callee.name===require&&['GaA7','ZG9f','vOiO','NGML','ZhRn','osjx'].includes(node.arguments[0]?.value)) {
              map.push({method:'native import',ref:node.arguments[0].value,context:source.slice(node.start-17,node.end+16)});
            }
          });
          const entry=statements.find(n=>n.type==='FunctionDeclaration'&&n.id.name==='aS');
          const service=statements.find(n=>n.type==='ClassDeclaration'&&n.id.name==='X');
          console.log('Candidate settings routing ' + JSON.stringify({map,entryBytes:src(entry)?.length,entryTail:src(entry)?.slice(-1700),settingsClassHead:src(service)?.slice(0,700)}));
          NODE
