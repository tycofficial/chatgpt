name: Verify the saved candidate and its recorded native fixtures
on:
  push:
    branches: [qa/weekly-upstream-0237c4dd]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: windows-2025
    timeout-minutes: 16
    defaults:
      run:
        shell: bash
    env:
      UPSTREAM: 0237c4dd9e54c7e3a619581b909d792de582fee9
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: chatgpt-verified-public-graph-0237c4dd
          path: ${{ runner.temp }}/chatgpt-candidate-archive
          github-token: ${{ github.token }}
          run-id: 45152117130
      - name: Unpack the already verified capture on this runner
        run: |
          set -euo pipefail
          task_tmp="$(cygpath -u "$RUNNER_TEMP")"
          mkdir -p "$task_tmp/chatgpt-upstream-capture"
          tar -C "$task_tmp/chatgpt-upstream-capture" -xzf "$task_tmp/chatgpt-candidate-archive/chatgpt-upstream.tar.gz"
          npm ci --no-audit --no-fund
      - name: Build the isolated candidate from the capture
        run: |
          set -euo pipefail
          node scripts/adopt-native-upstream.mjs "$RUNNER_TEMP/chatgpt-upstream-capture/$UPSTREAM"
          node scripts/build-native-client.mjs --activate
          npm run native:check
      - id: contracts
        name: Run the entire candidate regression suite
        continue-on-error: true
        run: |
          set -euo pipefail
          export GENERATED_PUBLICATION_TEST_TMPDIR="$(node -p "require('node:fs').realpathSync(process.env.RUNNER_TEMP)")"
          node --test --test-concurrency=2 tests/*.test.mjs
      - name: Report the candidate regression gate
        if: always()
        env:
          CONTRACTS: ${{ steps.contracts.outcome }}
        run: |
          printf 'Candidate regression gate %s\n' "$CONTRACTS" >> "$GITHUB_STEP_SUMMARY"
          printf 'Candidate regression gate %s\n' "$CONTRACTS"
