name: Trace the actual startup error and the changed public host settings boundary
on:
  push:
    branches: [qa/weekly-upstream-0237c4dd]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: windows-2025
    timeout-minutes: 16
    defaults:
      run:
        shell: bash
    env:
      UPSTREAM: 0237c4dd9e54c7e3a619581b909d792de582fee9
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: chatgpt-verified-public-graph-0237c4dd
          path: ${{ runner.temp }}/chatgpt-candidate-archive
          github-token: ${{ github.token }}
          run-id: 45152117130
      - name: Unpack the already verified capture on this runner
        run: |
          set -euo pipefail
          task_tmp="$(cygpath -u "$RUNNER_TEMP")"
          mkdir -p "$task_tmp/chatgpt-upstream-capture"
          tar -C "$task_tmp/chatgpt-upstream-capture" -xzf "$task_tmp/chatgpt-candidate-archive/chatgpt-upstream.tar.gz"
          npm ci --no-audit --no-fund
      - name: Compare the former and current public host boundaries
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import { parse } from 'acorn';
          import assert from 'node:assert/strict';
          const active=join(process.env.RUNNER_TEMP,'chatgpt-upstream-capture',process.env.UPSTREAM);
          const prior=JSON.parse(await readFile('original-client/resource-manifest.json','utf8'));
          const next=JSON.parse(await readFile(join(active,'capture-manifest.json'),'utf8'));
          assert.equal(next.sourceBuild,process.env.UPSTREAM);
          const selectedIds=['YCTv','PBZ3','ouEa','HkKI','WWxl','sm3b','osjx','OFP1','ADAj'];
          const boot=await readFile('src/native-client/boot-adapter.mjs','utf8');
          const overrideIds=[...new Set([...boot.matchAll(/\b(?:overrideExports|adaptFactory)\('([\w$]+)'/g)].map(match=>match[1]))];
          const watched=[...new Set([...selectedIds,...overrideIds])];
          const token=new RegExp('[,{]\\s*["\\x27]?(' + watched.map(name=>name.replaceAll('$','\\$')).join('|') + ')["\\x27]?\\s*(?=:\\s*\\(?function|\\()');
          const selector=/(?:readAll|3085093835|\/entities\/home|getLocalBusiness|local_business|cachedBindings|autoDisposeScheduled|WGhj)/;
          const objectName='__webpack_modules__';
          const classes = text => [...new Set([...text.matchAll(/(?:^|[^.\w])([A-Za-z_$][\w$]{2,})\([^)]{0,100}\)\{/g)].map(row=>row[1]))].slice(0,32);
          function tokens(text) {
            return [...new Set((text.match(/[A-Za-z_$][A-Za-z0-9_$]{4,}/g)??[]).filter(word=>word.length<32))];
          }
          function facts(property,source,file) {
            const { value }=property;
            const id=String(property.key.name ?? property.key.value);
            const text=source.slice(value.start,value.end);
            const third=value.params?.[2]?.name;
            const deps=third ? [...new Set([...text.matchAll(new RegExp('\\b'+third+'\\(["\\x27]([\\w$]{4})["\\x27]\\)','g'))].map(row=>row[1]))] : [];
            return { id,file,deps,text,methods:classes(text),words:tokens(text) };
          }
          function table(source) {
            const p=parse(source,{ ecmaVersion:'latest',sourceType:'module' });
            return p.body.flatMap(s=>(s.declaration??s).declarations??[]).filter(d=>d.id.name===objectName && d.init?.type==='ObjectExpression').flatMap(d=>d.init.properties);
          }
          async function collect(root, manifest, old) {
            const exact=new Map();
            const likely=[];
            const scanned=manifest.assets.filter(asset=>/^public\/chatgpt\.com\/cdn\/assets\/[\w/.-]+\.js$/.test(asset.path)&&!asset.path.split('/').includes('..'));
            let cursor=0;
            await Promise.all(Array.from({length:12},async()=>{
              while(cursor<scanned.length){
                const asset=scanned[cursor++];
                const text=await readFile(join(root,asset.path),'utf8');
                if(!text.includes(objectName) || !(token.test(text)||!old&&selector.test(text))) continue;
                let properties;
                try { properties=table(text); } catch { continue; }
                for(const property of properties) {
                  if(!property.value || !property.key) continue;
                  const id=String(property.key.name??property.key.value);
                  const raw=text.slice(property.value.start,property.value.end);
                  if(watched.includes(id)){
                    if(!exact.has(id))exact.set(id,[]);
                    exact.get(id).push(facts(property,text,asset.path));
                  }
                  if(!old && selector.test(raw)) likely.push(facts(property,text,asset.path));
                }
              }
            }));
            return {exact,likely};
          }
          const before=await collect('original-client',prior,true);
          const after=await collect(active,next,false);
          const report={missing:watched.filter(id=>!after.exact.has(id)),before:{},candidates:{}};
          for(const id of selectedIds) {
            const matches=before.exact.get(id)??[];
            report.before[id]=matches.slice(0,5).map(({file,deps,text,methods})=>({file,deps,methods,size:text.length}));
            if(after.exact.has(id)||!matches.length) continue;
            const old=matches[0], keys=new Set(old.words), common=(a,b)=>a.filter(x=>b.includes(x)).length;
            report.candidates[id]=after.likely
              .map(candidate=>{
                const overlap=candidate.words.filter(word=>keys.has(word)).length;
                const score=overlap/Math.max(1,Math.sqrt(keys.size*candidate.words.length))+
                  0.035*common(old.deps,candidate.deps)+0.02*common(old.methods,candidate.methods);
                return {id:candidate.id,file:candidate.file,size:candidate.text.length,
                  deps:candidate.deps.slice(0,20),methods:candidate.methods.slice(0,16),
                  score:Number(score.toFixed(3)),hasReadAll:candidate.text.includes('readAll')};
              })
              .sort((a,b)=>b.score-a.score).slice(0,7);
          }
          console.log('Native boundary comparison ' + JSON.stringify(report));
          NODE
      - name: Build the isolated candidate from the capture
        run: |
          set -euo pipefail
          node scripts/adopt-native-upstream.mjs "$RUNNER_TEMP/chatgpt-upstream-capture/$UPSTREAM"
          node scripts/build-native-client.mjs --activate
          npm run native:check
      - id: smoke
        name: Open the isolated candidate in real Microsoft Edge
        continue-on-error: true
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/weekly-browser" --no-audit --no-fund --package-lock=false playwright-core@1.58.2
          node scripts/serve-native-client.mjs > "$RUNNER_TEMP/weekly-native-preview.log" 2>&1 &
          site_pid=$!
          trap 'kill "$site_pid" 2>/dev/null || true' EXIT
          curl -fSs --retry 9 --retry-connrefused http://127.0.0.1:4400/chatgpt/native-client/active.json > /dev/null
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const {chromium}=await import(pathToFileURL(join(process.env.RUNNER_TEMP,'weekly-browser/node_modules/playwright-core/index.mjs')).href);
          const base='http://127.0.0.1:4400/chatgpt/';
          const manifest=await fetch(base+'native-client/active.json').then(r=>r.json());
          assert.equal(manifest.sourceBuild,process.env.UPSTREAM);
          const browser=await chromium.launch({channel:'msedge', headless:true});
          const errors=[],failedAssets=[],consoleErrors=[];
          try {
            const context=await browser.newContext({locale:'zh-CN'});
            const page=await context.newPage();
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text().slice(0,280));});
            page.on('pageerror',err=>errors.push({name:err.name,message:err.message.slice(0,180)}));
            page.on('response',r=>{
              const url=new URL(r.url());
              if (r.status()>=400&&url.host==='127.0.0.1:4400'&&url.pathname.includes('/original-client/')) {
                failedAssets.push({path:url.pathname,status:r.status()});
              }
            });
            try {
              await page.goto(base,{waitUntil:'domcontentloaded',timeout:35000});
              await page.locator('#prompt-textarea[contenteditable="true"], .ProseMirror[contenteditable="true"]').first().waitFor({state:'visible',timeout:27000});
              const flags=await page.evaluate(()=>({sourceBuild:document.documentElement.dataset.build,
                boot:window.__CHATGPT_REPLICA_ENV__?.release,path:location.pathname,title:document.title,
                sidebar:!!document.querySelector('[data-testid="profile-button"]'), probe:window.__originalClientProbe?.length ?? null}));
              assert.equal(flags.sourceBuild, process.env.UPSTREAM);
              assert.equal(flags.boot,manifest.release);
              console.log('Edge loaded the candidate ' + JSON.stringify(flags));
            } finally {
              const state=await page.evaluate(()=>({title:document.title,path:location.pathname,
                failure:window.__CHATGPT_STARTUP_ERROR__ ?? null, body:document.body?.innerText.replace(/\s+/g,' ').slice(0,270),
                controls:[...document.querySelectorAll('button')].filter(btn=>btn.getClientRects().length).slice(0,22).map(btn=>btn.getAttribute('aria-label')??btn.textContent?.trim().slice(0,30)),
              })).catch(()=>null);
              console.log('Edge candidate state ' + JSON.stringify({state,errors:errors.slice(-15),consoleErrors:consoleErrors.slice(-12),failedAssets:failedAssets.slice(-30)}));
            }
          } finally { await browser.close(); }
          NODE
      - name: Record the candidate browser result
        if: always()
        shell: bash
        env:
          SMOKE: ${{ steps.smoke.outcome }}
        run: printf 'Candidate startup in Edge %s\n' "$SMOKE" >> "$GITHUB_STEP_SUMMARY"
