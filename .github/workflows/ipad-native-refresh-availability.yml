name: Verify native iPad Safari reload availability

on:
  push:
    branches: [qa/ipad-native-refresh-availability]
    paths: [.github/workflows/ipad-native-refresh-availability.yml, scripts/qa/ipad-xcuitest/SafariQAUITests/SafariPublicSiteTests.swift]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  safari:
    runs-on: macos-26
    timeout-minutes: 19
    env:
      IPAD_QA_PROJECT: scripts/qa/ipad-xcuitest/SafariQA.xcodeproj
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: scripts/qa/ipad-xcuitest

      - name: Select the installed iPad Simulator
        run: |
          xcodebuild -version
          sw_vers
          xcrun simctl list devices available -j | node scripts/qa/ipad-xcuitest/select-device.mjs >> "$GITHUB_ENV"

      - name: Build the native UI test runner for the selected iPad
        timeout-minutes: 8
        run: |
          printf 'Testing %s on iPadOS %s\n' "$IPAD_NAME" "$IPAD_OS"
          plutil -lint "$IPAD_QA_PROJECT/project.pbxproj"
          xcodebuild -project "$IPAD_QA_PROJECT" -list -json | jq -e '.project.schemes | index("SafariQA")' >/dev/null
          xcodebuild build-for-testing -project "$IPAD_QA_PROJECT" -scheme SafariQA \
            -destination "platform=iOS Simulator,id=$IPAD_UDID" \
            -derivedDataPath "$RUNNER_TEMP/ipad-xcuitest-build" \
            -parallel-testing-enabled NO -quiet

      - name: Boot the selected device and verify installed MobileSafari
        timeout-minutes: 5
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          if ! xcrun simctl bootstatus "$IPAD_UDID" -b; then
            xcrun simctl bootstatus "$IPAD_UDID"
          fi
          xcrun simctl list devices booted
          xcrun simctl launch "$IPAD_UDID" com.apple.mobilesafari

      - name: Open and reload the loopback fixture using installed Safari
        timeout-minutes: 9
        run: |
          fixture="$RUNNER_TEMP/ipad-refresh-fixture.cjs"
          log="$RUNNER_TEMP/ipad-refresh-server.log"
          cat > "$fixture" <<'NODE'
          const fs = require('node:fs');
          const http = require('node:http');
          const temporary = process.env.RUNNER_TEMP;
          const counterPath = temporary + '/ipad-refresh-document-count';
          let visits = 0;
          fs.writeFileSync(counterPath, String(visits));
          const server = http.createServer((request, response) => {
            const pathname = new URL(request.url, 'http://127.0.0.1').pathname;
            const headers = { 'Cache-Control': 'no-store' };
            if (pathname === '/navigation-count') {
              response.writeHead(200, headers).end(String(visits));
              return;
            }
            if (pathname !== '/chatgpt/' && pathname !== '/chatgpt') {
              response.writeHead(404, headers).end();
              return;
            }
            headers['Content-Type'] = 'text/html; charset=utf-8';
            if (request.method === 'HEAD') {
              response.writeHead(200, headers).end();
              return;
            }
            if (request.method !== 'GET') {
              response.writeHead(405, headers).end();
              return;
            }
            const current = ++visits;
            fs.writeFileSync(counterPath, String(current));
            console.log('Fixture document GET ' + current);
            const first = current === 1;
            const heading = first ? 'Native Safari fixture generation 1' : 'Native Safari reloaded fixture';
            const js = first
              ? "localStorage.setItem('native-refresh-witness','origin');sessionStorage.setItem('native-refresh-witness','tab');" +
                "originWitness.textContent='Fixture storage marker written';tabWitness.textContent='Fixture tab marker written';"
              : "originWitness.textContent=localStorage.getItem('native-refresh-witness')==='origin'?'Fixture storage marker retained':'Fixture storage marker missing';" +
                "tabWitness.textContent=sessionStorage.getItem('native-refresh-witness')==='tab'?'Fixture tab marker retained':'Fixture tab marker missing';";
            response.writeHead(200, headers).end(
              '<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1">' +
              '<title>Native Safari reload fixture</title><main><h1>' + heading + '</h1><p id="origin-witness"></p>' +
              '<p id="tab-witness"></p></main><script>const originWitness=document.getElementById("origin-witness");' +
              'const tabWitness=document.getElementById("tab-witness");' + js + '</script></html>',
            );
          });
          server.listen(0, '127.0.0.1', () => fs.writeFileSync(temporary + '/ipad-refresh-port', String(server.address().port)));
          NODE
          node --check "$fixture"
          node "$fixture" > "$log" 2>&1 </dev/null &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            [[ -s "$RUNNER_TEMP/ipad-refresh-port" ]] && break
            if ! kill -0 "$fixture_pid" 2>/dev/null; then cat "$log"; exit 1; fi
            sleep 1
          done
          if [[ ! -s "$RUNNER_TEMP/ipad-refresh-port" ]]; then cat "$log"; exit 1; fi
          port="$(cat "$RUNNER_TEMP/ipad-refresh-port")"
          ready="$(curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:$port/navigation-count")"
          [[ "$ready" == 0 ]]
          echo "Native Safari loopback fixture verified before the first navigation"
          xcrun simctl openurl "$IPAD_UDID" "http://127.0.0.1:$port/chatgpt/"
          # Only the fixed native action markers leave the runner.
          set -o pipefail
          umask 077
          raw="$RUNNER_TEMP/ipad-xcuitest-private.log"
          phases="$RUNNER_TEMP/ipad-xcuitest-phases.log"
          results="$RUNNER_TEMP/ipad-xcuitest.xcresult"
          set +e
          xcodebuild test-without-building -project "$IPAD_QA_PROJECT" -scheme SafariQA \
            -destination "platform=iOS Simulator,id=$IPAD_UDID" \
            -derivedDataPath "$RUNNER_TEMP/ipad-xcuitest-build" -resultBundlePath "$results" \
            -only-testing:SafariQAUITests/SafariPublicSiteTests/testNativeSafariRefreshAvailability \
            -parallel-testing-enabled NO -disable-concurrent-destination-testing \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 480 2>&1 | tee "$raw" | \
            awk 'match($0, /IPAD_UI_QA (native-availability-runner|native-safari-foreground|native-first-document|native-reload-tapped|native-reloaded-document|native-storage-retention|native-tab-retention|native-initial-document-still-visible|native-initial-document-absent|native-webview-present|native-webview-absent|failed-[a-z-]+)\r?$/) { print substr($0, RSTART, RLENGTH); fflush() }' | tee "$phases"
          build_exit="${PIPESTATUS[0]}"
          set -e
          printf 'XCTest exit status %s\n' "$build_exit"
          if [[ "$build_exit" != 0 ]]; then
            sed -nE 's#^.*SafariPublicSiteTests\.swift:([0-9]+): error:.*#XCTest reported an error at Swift line \1#p' "$raw" | sort -u
          fi
          counts="$RUNNER_TEMP/ipad-xcuitest-counts.json"
          if [[ -d "$results" ]]; then
            xcrun xcresulttool get test-results summary --path "$results" | jq '{totalTestCount, passedTests, failedTests, skippedTests}' | tee "$counts"
          fi
          [[ "$build_exit" == 0 ]] || exit "$build_exit"
          jq -e '.totalTestCount == 1 and .passedTests == 1 and .failedTests == 0' "$counts" >/dev/null
          grep -Fxq "IPAD_UI_QA native-reload-tapped" "$phases"
          grep -Fxq "IPAD_UI_QA native-storage-retention" "$phases"
          grep -Fxq "IPAD_UI_QA native-tab-retention" "$phases"
          count="$(cat "$RUNNER_TEMP/ipad-refresh-document-count")"
          [[ "$count" =~ ^[0-9]+$ ]] && (( count >= 2 ))

      - name: Report the native Safari fixture GET count
        if: always()
        run: |
          counter="$RUNNER_TEMP/ipad-refresh-document-count"
          count=unavailable
          if [[ -f "$counter" ]]; then count="$(cat "$counter")"; fi
          printf 'Native Safari server document GET count %s\n' "$count"
          log="$RUNNER_TEMP/ipad-refresh-server.log"
          if [[ -f "$log" ]]; then sed -nE '/^Fixture document GET [0-9]+$/p' "$log"; fi
