name: iPadOS native Safari XCTest QA

on:
  push:
    branches: [qa/ipad-simulator]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  safari:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      IPAD_QA_PROJECT: scripts/qa/ipad-xcuitest/SafariQA.xcodeproj
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: scripts/qa/ipad-xcuitest

      - name: Select an installed iPad and record the public release
        run: |
          xcodebuild -version
          sw_vers
          xcrun simctl list devices available -j | node scripts/qa/ipad-xcuitest/select-device.mjs >> "$GITHUB_ENV"
          public_release="$(curl --fail --silent --show-error --max-time 15 'https://tycofficial.github.io/chatgpt/native-client/active.json' | jq -er '.release | select(test("^[0-9a-f]{16}$"))')"
          printf 'IPAD_QA_PUBLIC_RELEASE=%s\n' "$public_release" >> "$GITHUB_ENV"
          printf 'Public release %s\n' "$public_release"

      - name: Build the native UI test runner for the selected iPad
        timeout-minutes: 8
        run: |
          printf 'Testing %s on iPadOS %s\n' "$IPAD_NAME" "$IPAD_OS"
          plutil -lint "$IPAD_QA_PROJECT/project.pbxproj"
          xcodebuild -project "$IPAD_QA_PROJECT" -list -json | jq -e '.project.schemes | index("SafariQA")' >/dev/null
          xcodebuild build-for-testing -project "$IPAD_QA_PROJECT" -scheme SafariQA \
            -destination "platform=iOS Simulator,id=$IPAD_UDID" \
            -derivedDataPath "$RUNNER_TEMP/ipad-xcuitest-build" \
            -parallel-testing-enabled NO -quiet

      - name: Boot the selected device and verify installed MobileSafari
        timeout-minutes: 5
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          if ! xcrun simctl bootstatus "$IPAD_UDID" -b; then
            xcrun simctl bootstatus "$IPAD_UDID"
          fi
          xcrun simctl list devices booted
          xcrun simctl launch "$IPAD_UDID" com.apple.mobilesafari

      - name: Open the original public login in iPad Safari
        timeout-minutes: 2
        run: xcrun simctl openurl "$IPAD_UDID" 'https://tycofficial.github.io/chatgpt/auth/login/'

      - name: Photograph Safari on the public login before entering synthetic data
        timeout-minutes: 2
        continue-on-error: true
        run: |
          sleep 8
          xcrun simctl io "$IPAD_UDID" screenshot "$RUNNER_TEMP/ipad-safari-xcuitest-public.png"
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/ipad-safari-xcuitest-public.png"

      - name: Attach the anonymous Safari baseline
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: ipad-xcuitest-public-safari-before-login
          path: ${{ runner.temp }}/ipad-safari-xcuitest-public.png
          if-no-files-found: warn
          retention-days: 7

      - name: Exercise Safari using Apple XCTest UI automation
        timeout-minutes: 11
        run: |
          # XCTest may include form values in raw diagnostics or attachments.
          # Only fixed phase tags and numeric counts leave the runner.
          umask 077
          raw="$RUNNER_TEMP/ipad-xcuitest-private.log"
          phases="$RUNNER_TEMP/ipad-xcuitest-phases.log"
          results="$RUNNER_TEMP/ipad-xcuitest.xcresult"
          set +e
          xcodebuild test-without-building -project "$IPAD_QA_PROJECT" -scheme SafariQA \
            -destination "platform=iOS Simulator,id=$IPAD_UDID" \
            -derivedDataPath "$RUNNER_TEMP/ipad-xcuitest-build" -resultBundlePath "$results" \
            -only-testing:SafariQAUITests/SafariPublicSiteTests/testPublicLoginRefreshAndFollowUpInSafari \
            -parallel-testing-enabled NO -disable-concurrent-destination-testing \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 480 2>&1 | tee "$raw" | \
            awk 'match($0, /IPAD_UI_QA (runner-started|seeded-public-account|safari-foreground|public-login-web-content|login-form|login-keyboard|login-username-entered|login-password-entered|login-submitted|login-returned-to-chat|first-send-visible|first-reply-before-reload|reload-while-reply-pending|safari-reload-tapped|first-conversation-restored|follow-up-sent|same-conversation-follow-up-verified|failed-[a-z-]+)\r?$/) { print substr($0, RSTART, RLENGTH); fflush() }' | tee "$phases"
          build_exit="${PIPESTATUS[0]}"
          set -e
          printf 'XCTest exit status %s\n' "$build_exit"
          if [[ "$build_exit" != 0 ]]; then
            sed -nE 's#^.*SafariPublicSiteTests\.swift:([0-9]+): error:.*#XCTest reported an error at Swift line \1#p' "$raw" | sort -u
          fi
          counts="$RUNNER_TEMP/ipad-xcuitest-counts.json"
          if [[ -d "$results" ]]; then
            if xcrun xcresulttool get test-results summary --path "$results" 2>/dev/null | \
              jq '{totalTestCount, passedTests, failedTests, skippedTests} | with_entries(select(.value | type == "number"))' > "$counts"; then
              cat "$counts"
            fi
          fi
          if [[ "$build_exit" != 0 ]] && ! grep -q '^IPAD_UI_QA runner-started' "$phases"; then
            if grep -qiE 'testmanagerd|test runner failed|failed to (establish|prepare|launch)' "$raw"; then
              echo '::warning::Apple test runner setup did not reach the Safari test.'
            else
              echo '::warning::No Safari UI test phase was emitted.'
            fi
          fi
          if [[ "$build_exit" != 0 ]]; then exit "$build_exit"; fi
          if ! grep -q '^IPAD_UI_QA same-conversation-follow-up-verified' "$phases"; then
            jq -e '.passedTests == 1 and .failedTests == 0' "$counts" >/dev/null
          fi
          public_release="$(curl --fail --silent --show-error --max-time 15 'https://tycofficial.github.io/chatgpt/native-client/active.json' | jq -er '.release | select(test("^[0-9a-f]{16}$"))')"
          [[ "$public_release" == "$IPAD_QA_PUBLIC_RELEASE" ]]
          {
            printf '## iPadOS Safari XCTest\n\n%s, iPadOS %s, public release `%s`\n\n' "$IPAD_NAME" "$IPAD_OS" "$public_release"
            sed 's/^/    /' "$phases"
          } >> "$GITHUB_STEP_SUMMARY"
