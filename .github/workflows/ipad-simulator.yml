name: iPadOS Safari simulator QA

on:
  push:
    branches: [qa/ipad-simulator]

permissions:
  contents: read

jobs:
  safari:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      IPAD_LIVE_CHAT: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: scripts/qa/ipad-simulator.mjs
          sparse-checkout-cone-mode: false

      - name: Select an installed iPad simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available -j | node scripts/qa/ipad-simulator.mjs select-device >> "$GITHUB_ENV"

      - name: Enable Apple's Safari WebDriver
        run: |
          node --version
          sw_vers
          /usr/bin/safaridriver --version
          sudo -n /usr/bin/safaridriver --enable

      - name: Boot the selected iPad and launch MobileSafari
        timeout-minutes: 8
        run: |
          developer_dir="$(xcode-select -p)"
          device_hub="$developer_dir/../Applications/DeviceHub.app"
          if ! xcrun simctl bootstatus "$IPAD_UDID" -b; then
            xcrun simctl bootstatus "$IPAD_UDID"
          fi
          if [[ -d "$device_hub" ]]; then
            open -a "$device_hub" "devices://device/open?id=$IPAD_UDID" || echo '::warning::DeviceHub could not display the selected simulator.'
          else
            open -a "$developer_dir/Applications/Simulator.app" --args -CurrentDeviceUDID "$IPAD_UDID" || echo '::warning::Simulator.app could not display the selected simulator.'
          fi
          xcrun simctl list devices booted
          xcrun simctl launch "$IPAD_UDID" com.apple.mobilesafari

      - name: Capture an anonymous Safari baseline independently of WebDriver
        timeout-minutes: 2
        continue-on-error: true
        run: |
          xcrun simctl openurl "$IPAD_UDID" 'https://tycofficial.github.io/chatgpt/'
          sleep 8
          xcrun simctl io "$IPAD_UDID" screenshot "$RUNNER_TEMP/ipad-safari-public.png"
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/ipad-safari-public.png"

      - name: Attach the pre-registration Safari screenshot
        uses: actions/upload-artifact@v6
        with:
          name: ipad-simulator-public-safari-before-signup
          path: ${{ runner.temp }}/ipad-safari-public.png
          if-no-files-found: warn
          retention-days: 7

      - name: Verify the public site using Apple's native Safari WebDriver
        timeout-minutes: 10
        run: |
          /usr/bin/safaridriver -p 4723 > "$RUNNER_TEMP/ipad-safaridriver.log" 2>&1 &
          safari_driver_pid=$!
          trap 'kill "$safari_driver_pid" 2>/dev/null || true' EXIT
          node scripts/qa/ipad-simulator.mjs
