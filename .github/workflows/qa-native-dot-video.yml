name: Verify the native Dot video and Linux controls
on:
  push:
    branches: [qa/native-dot-video-controls]
permissions:
  contents: read
  actions: read
jobs:
  native-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      UPSTREAM: 0237c4dd9e54c7e3a619581b909d792de582fee9
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: chatgpt-public-interactions-single-graph
          path: ${{ runner.temp }}/chatgpt-candidate-archive
          github-token: ${{ github.token }}
          run-id: 45162484586
      - name: Prepare the verified original native archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chatgpt-upstream-capture"
          tar -C "$RUNNER_TEMP/chatgpt-upstream-capture" -xzf "$RUNNER_TEMP/chatgpt-candidate-archive/chatgpt-public-graph.tar.gz"
          npm ci --no-audit --no-fund
          node scripts/adopt-native-upstream.mjs "$RUNNER_TEMP/chatgpt-upstream-capture/$UPSTREAM"
      - name: Install the isolated graphics runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libx11-6 libxtst6 python3-tk bubblewrap
          npm install --no-save --package-lock=false --no-audit --no-fund playwright-core@1.58.2
          npx playwright-core install --with-deps chromium
      - name: Exercise real video, mouse and keyboard at reduced decode resolution
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1024x720x24 -nolisten tcp -noreset' node scripts/qa/native-dot-video.mjs
