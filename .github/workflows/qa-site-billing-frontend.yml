name: Verify native site billing frontend in hosted Edge
on:
  push:
    branches: [qa/site-billing-frontend]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      UPSTREAM: 0237c4dd9e54c7e3a619581b909d792de582fee9
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: chatgpt-public-interactions-single-graph
          path: ${{ runner.temp }}/chatgpt-candidate-archive
          github-token: ${{ github.token }}
          run-id: 45162484586
      - name: Unpack the already verified capture on this runner
        run: |
          set -euo pipefail
          task_tmp="$(cygpath -u "$RUNNER_TEMP")"
          mkdir -p "$task_tmp/chatgpt-upstream-capture"
          tar -C "$task_tmp/chatgpt-upstream-capture" -xzf "$task_tmp/chatgpt-candidate-archive/chatgpt-public-graph.tar.gz"
          npm ci --no-audit --no-fund
      - name: Verify account receipts and native billing transports
        run: node --test tests/site-account.test.mjs
      - name: Build the original client against the isolated billing fixture
        run: |
          node scripts/adopt-native-upstream.mjs "$RUNNER_TEMP/chatgpt-upstream-capture/$UPSTREAM"
          CHATGPT_SITE_API_ORIGIN=https://site-billing-fixture.invalid node scripts/build-native-client.mjs --activate
          npm run native:check
          npm install --no-save --package-lock=false --no-audit --no-fund playwright-core@1.58.2
      - name: Exercise the original pricing and account views in Edge
        run: node scripts/qa/native-site-billing.mjs
