name: Inspect the captured original Maps queries
on:
  push:
    branches: [qa/sync-0237-maps]
    paths: [.github/workflows/inspect-0237-maps.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      UPSTREAM: 0237c4dd9e54c7e3a619581b909d792de582fee9
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: chatgpt-public-interactions-single-graph
          path: ${{ runner.temp }}/chatgpt-candidate-archive
          github-token: ${{ github.token }}
          run-id: 45162484586
      - name: Unpack the already verified capture on this runner
        run: |
          set -euo pipefail
          task_tmp="$(cygpath -u "$RUNNER_TEMP")"
          mkdir -p "$task_tmp/chatgpt-upstream-capture"
          tar -C "$task_tmp/chatgpt-upstream-capture" -xzf "$task_tmp/chatgpt-candidate-archive/chatgpt-public-graph.tar.gz"
          npm ci --no-audit --no-fund
      - name: Report only verified query anchors and aliases
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          const path = require('node:path');
          const { parse } = require('acorn');
          const sha = bytes => createHash('sha256').update(bytes).digest('hex');
          const key = node => node?.name ?? node?.value;
          const queryMarkers = /^(?:maps-home|shared-maps-place|\/local\/[a-z_{}\/-]+|ChatGPT-Account-ID|oai-language)$/i;
          function walk(node, visit) {
            if (!node || typeof node.type !== 'string') return;
            visit(node);
            for (const value of Object.values(node)) {
              if (Array.isArray(value)) for (const member of value) walk(member, visit);
              else walk(value, visit);
            }
          }
          function member(node) {
            if (node?.type === 'Identifier') return node.name;
            if (node?.type !== 'MemberExpression' || node.computed && node.property.type !== 'Literal') return null;
            const prefix = member(node.object);
            return prefix && typeof key(node.property) === 'string' ? prefix + '.' + key(node.property) : null;
          }
          function originalQueries(root, manifestFile, expectedBuild, chunkId, factoryId) {
            const graph = JSON.parse(readFileSync(path.join(root, manifestFile), 'utf8'));
            assert.equal(graph.sourceBuild, expectedBuild);
            const pattern = new RegExp('^https://chatgpt\\.com/cdn/assets/(?:async/)?' + chunkId + '\\.[a-f\\d]{8,}\\.js$');
            const assets = graph.assets.filter(asset => pattern.test(asset.url));
            assert.equal(assets.length, 1);
            const asset = assets[0], url = new URL(asset.url);
            assert.equal(asset.path, 'public/' + url.hostname + url.pathname);
            const bytes = readFileSync(path.join(root, asset.path));
            assert.equal(sha(bytes), asset.sha256);
            const code = bytes.toString('utf8');
            const { body } = parse(code, { ecmaVersion: 'latest', sourceType: 'module' });
            const table = body.flatMap(node => (node.declaration ?? node).declarations ?? [])
              .find(declaration => declaration.id.name === '__webpack_modules__').init;
            const entries = table.properties.filter(property => key(property.key) === factoryId);
            assert.equal(entries.length, 1);
            const factory = entries[0].value;
            const declarations = new Map();
            for (const statement of factory.body.body) {
              if (statement.type === 'FunctionDeclaration') declarations.set(statement.id.name, statement);
              for (const d of statement.declarations ?? []) if (d.id.type === 'Identifier' && d.init) declarations.set(d.id.name, d.init);
            }
            const aliases = new Map();
            for (const [name, value] of declarations) {
              const call = value.type === 'MemberExpression' ? value.object : value;
              if (call.type === 'CallExpression' && call.callee.name === factory.params[2].name && /^[A-Za-z0-9+_$-]{1,12}$/.test(call.arguments[0]?.value ?? '')) {
                aliases.set(name, String(call.arguments[0].value) + (value.type === 'MemberExpression' ? '.' + key(value.property) : ''));
              }
            }
            function inspect(name) {
              const value = declarations.get(name), markers = new Set(), members = new Set(), helpers = new Set(), queryProps = new Set();
              walk(value, node => {
                if (node.type === 'Literal' && typeof node.value === 'string' && queryMarkers.test(node.value)) markers.add(node.value);
                if (node.type === 'Property' && ['queryKey', 'queryFn', 'enabled', 'retry'].includes(key(node.key))) queryProps.add(key(node.key));
                if (node.type === 'MemberExpression') {
                  const access = member(node);
                  if (access && aliases.has(access.split('.')[0])) members.add(access);
                }
                if (node.type === 'CallExpression' && declarations.has(node.callee.name) && node.callee.name !== name && !aliases.has(node.callee.name)) {
                  helpers.add(node.callee.name);
                }
              });
              return { name, type: value.type, markers: [...markers], query: [...queryProps],
                members: [...members], helpers: [...helpers], fingerprint: sha(code.slice(value.start, value.end)) };
            }
            const queries = [...declarations.keys()].map(inspect).filter(row => row.markers.length || row.query.includes('queryFn'));
            const helperNames = new Set(queries.flatMap(query => query.helpers));
            const helpers = [...helperNames].map(inspect);
            const usefulAliases = new Set([...queries, ...helpers].flatMap(row => row.members.map(field => field.split('.')[0])));
            assert.ok(queries.length > 0 && queries.length <= 35, 'Unexpected Maps query inventory');
            console.log('Maps AST ' + JSON.stringify({ build: graph.sourceBuild, chunkId, factoryId, asset: url.pathname,
              queries, helpers, aliases: Object.fromEntries([...aliases].filter(([name]) => usefulAliases.has(name))) }));
          }
          originalQueries('original-client', 'resource-manifest.json', 'b6348792a294e8e04a67660959ba41914937938f', 297551, 'sm3b');
          originalQueries(path.join(process.env.RUNNER_TEMP, 'chatgpt-upstream-capture', process.env.UPSTREAM), 'capture-manifest.json', process.env.UPSTREAM, 390269, 'RfIz');
          NODE
      - name: Test Maps against the retained graph
        run: node --test tests/native-maps-service.test.mjs
      - name: Test Maps against the verified 0237 graph
        run: |
          set -euo pipefail
          node scripts/adopt-native-upstream.mjs "$RUNNER_TEMP/chatgpt-upstream-capture/$UPSTREAM"
          node --test tests/native-maps-service.test.mjs
