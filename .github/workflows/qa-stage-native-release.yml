                  const data = JSON.parse(localStorage.getItem(key));
                  for (const thread of data.threads) {
                    if (thread.executionSurface !== 'work' && thread.adapterMetadata?.executionSurface !== 'work') continue;
                    for (const turn of thread.turns) {
                      if (turn.status !== 'completed' || !turn.items.some(item=>item.type==='userMessage'&&JSON.stringify(item.content).includes(sample))) continue;
