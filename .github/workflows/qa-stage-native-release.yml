name: Diagnose Codex's published Responses stream
on:
  push:
    branches: [qa/codex-public-summary-heading]
permissions:
  contents: read
jobs:
  responses:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SITE: https://tycofficial.github.io
      API: https://chatgpt-admin-bridge-tyc.hushedtarragon1.chatgpt.site
      MAIN: b020a4a479cad1bc93614537e8881831ffca71ba
    steps:
      - name: Inspect one synthetic account's output transitions
        run: |
          node --input-type=module <<'NODE'
          import { createHash, randomUUID } from 'node:crypto';
          import assert from 'node:assert/strict';
          const { SITE, API, MAIN } = process.env;
          const loaded = await fetch('https://raw.githubusercontent.com/tycofficial/chatgpt/' + MAIN + '/runtime.js');
          assert.equal(loaded.status, 200);
          const runtime = await import('data:text/javascript;base64,' + Buffer.from(await loaded.text()).toString('base64'));
          async function post(path, body, token, requestId) {
            return fetch(API + path, { method: 'POST',
              signal: AbortSignal.timeout(72000),
              headers: { 'Content-Type': 'application/json', Origin: SITE,
                ...(token ? { Authorization: 'Bearer ' + token } : {}),
                ...(requestId ? { 'X-Chat-Request-Id': requestId } : {}) },
              body: JSON.stringify(body) });
          }
          const nonce = randomUUID().replace(/-/g, '').slice(0, 10);
          const account = await post('/auth/register', { username:'qastream' + nonce, password:'Qa9stream' + randomUUID() });
          assert.equal(account.status, 200);
          const { token } = await account.json();
          const trial = await post('/auth/site-trial', { tier:'pro' }, token);
          assert.equal(trial.status, 200);
          assert.equal((await trial.json()).user?.planType, 'pro');
          const itemHash = id => id ? createHash('sha256').update(id).digest('hex').slice(0, 7) : null;
          const texts = new Map();
          const patches = [];
          const inspect = (source, index, part, text, append) => {
            if (typeof text !== 'string') text = '';
            const key = index + ':' + part;
            const old = texts.get(key) ?? '';
            const next = append ? old + text : text;
            if (!next.startsWith(old)) {
              let common = 0;
              while (common < next.length && common < old.length && next[common] === old[common]) common++;
              patches.push({ source, index, part, oldLength:old.length, newLength:next.length, common, beforeWhitespace:old.length - old.trim().length, afterWhitespace:next.length - next.trim().length });
            }
            texts.set(key, next);
          };
          for (const variant of [0,1,2]) {
            texts.clear(); patches.length = 0;
            const sample = 'CODEXQA-' + nonce + variant;
            const payload = {
              model:'gpt-6.2-sol', stream:true, store:false, include:['reasoning.encrypted_content'],
              reasoning:{ effort:'low', summary:'auto' },
              input:[{ role:'system', content:'Execute requested work using the available real tools instead of only announcing a plan. Continue correcting actual tool errors and give a final answer after the work is complete or an actual limitation has been identified. Python runs in a browser Pyodide environment, not a hosted shell; only workspace files persist after reload. Never claim unexecuted shell, network or file operations. Return real artifact download URLs supplied by tools.' },
                { role:'user', content:(variant === 0 ? '' : '先告诉我你要运行什么，再实际执行。') + '请用 Python 工具实际执行 print("' + sample + '-" + str(17 * 19))。执行完后回复实际输出。' }],
              tools:runtime.toResponsesTools([runtime.PYTHON_TOOL]), tool_choice:'auto',
            };
            const response = await post('/inference/v1/responses', payload, token, randomUUID());
            console.log('Probe status ' + JSON.stringify({variant,status:response.status,contentType:response.headers.get('content-type')}));
            if (!response.ok) { await response.body?.cancel(); continue; }
            const raw = await response.text();
            const events = [];
            for (const batch of raw.split(/\r?\n\r?\n/)) {
              const value = batch.split(/\r?\n/).filter(v=>v.startsWith('data:')).map(v=>v.slice(5).trimStart()).join('\n');
              if (!value || value==='[DONE]') continue;
              const e = JSON.parse(value), index = e.output_index;
              if (e.type === 'response.output_text.delta' || e.type === 'response.output_text.done') {
                inspect(e.type, index ?? 0, e.content_index ?? 0, e.delta ?? e.text, e.type.endsWith('.delta'));
                if (e.type.endsWith('.done')) events.push({ type:e.type,index,id:itemHash(e.item_id),size:e.text?.length ?? null, keys:Object.keys(e) });
              }
              const items = e.response?.output;
              const describe = (item) => ({ type:item?.type, phase:item?.phase, id:itemHash(item?.id), status:item?.status,
                content:item?.content?.map(p=>({ type:p.type, size:p.text?.length ?? null, keys:Object.keys(p) })) });
              if (e.type.startsWith('response.output_item')) {
                events.push({type:e.type,index,item:describe(e.item)});
                for (const [i,p] of (e.item?.content ?? []).entries()) {
                  if (p.type==='output_text') inspect(e.type,index ?? 0,i,p.text,false);
                }
              } else if ((e.type==='response.completed' || e.type==='response.incomplete') && Array.isArray(items)) {
                events.push({type:e.type,items:items.map(describe)});
                for (const [at,item] of items.entries()) {
                  for (const [i,p] of (item.content ?? []).entries()) {
                    if (p.type==='output_text') inspect(e.type,at,i,p.text,false);
                  }
                }
              }
            }
            console.log('Probe transitions ' + JSON.stringify({ variant, events, patches }));
          }
          NODE
