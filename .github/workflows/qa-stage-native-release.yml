          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { randomUUID } from 'node:crypto';
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { chromium } = await import(pathToFileURL(join(process.env.RUNNER_TEMP, 'pages-browser/node_modules/playwright-core/index.mjs')).href);
          const { SITE, API, RELEASE } = process.env;
          const home = new URL(SITE), nonce = randomUUID().replace(/-/g, '').slice(0, 10);
          const username = 'qacodex' + nonce, password = 'Qa9codex' + randomUUID().replace(/-/g, '');
          const sample = 'CODEXQA-' + nonce, expected = sample + '-323';
          const query = '先简短说明要做什么，再用 Python 工具实际执行 print("' + sample + '-" + str(17 * 19))。执行完后回复实际输出。';
          const continuation = '请回复上一次实际 Python 输出的完整第一行，并追加 -NEXT。只输出这一行。';
          const stage = (name, detail) => console.log('Codex QA ' + name + (detail === undefined ? '' : ' ' + JSON.stringify(detail)));
          async function post(path, data, token) {
            const result = await fetch(API + path, { method:'POST',
              headers: { Origin: home.origin, 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
              body: JSON.stringify(data), signal: AbortSignal.timeout(22000) });
            assert.equal(result.status, 200, path + ' refused the QA account operation');
            return result.json();
          }
          const active = await fetch(new URL('native-client/active.json?codex_qa=' + RELEASE, home), { signal: AbortSignal.timeout(18000) });
          assert.equal((await active.json()).release, RELEASE);
          const assigned = await post('/auth/register', { username, password });
          assert.equal(assigned.user?.planType, 'free');
          const trial = await post('/auth/site-trial', { tier:'pro' }, assigned.token);
          assert.equal(trial.user?.planType, 'pro');
          assert.equal(trial.user?.siteTrial?.tier, 'pro');
          stage('activated-a-normal-site-pro-trial');

          const browser = await chromium.launch({ channel: 'msedge', headless: true });
          const inference = [], errors = [];
          const isModel = request => request.method() === 'POST' && request.url() === API + '/inference/v1/responses';
          try {
            const context = await browser.newContext({ locale:'zh-CN' });
            const page = await context.newPage();
            page.on('request', request => {
              if (!isModel(request)) return;
              const body = request.postDataJSON();
              inference.push({ model: body?.model, effort:body?.reasoning?.effort, tier:body?.service_tier,
                python:body?.tools?.some(tool => (tool.name ?? tool.function?.name) === 'python') });
            });
            page.on('pageerror', error => { if (errors.length < 10) errors.push(error.name); });
            try {
              await page.goto(new URL('auth/login/',home).href,{waitUntil:'domcontentloaded',timeout:40000});
              await page.locator('#site-username').fill(username);
              await page.locator('#site-password').fill(password);
              const [reply] = await Promise.all([
                page.waitForResponse(r=>r.url()===API+'/auth/login'&&r.request().method()==='POST',{timeout:35000}),
                page.getByRole('button',{name:'继续',exact:true}).click(),
              ]);
              assert.equal(reply.status(),200);
              await page.waitForURL(url=>url.origin===home.origin&&url.pathname===home.pathname,{timeout:40000});
              const pro = await page.evaluate(async release => {
                const a = await import('./native-client/site-account.mjs?v=' + release);
                const user = a.getSiteAccount() ?? await a.refreshSiteAccount();
                return {plan:user?.planType,verified:user?.cloudSessionVerified};
              }, RELEASE);
              assert.deepEqual(pro,{plan:'pro',verified:true});
              await page.waitForFunction(release=>window.__CHATGPT_REPLICA_ENV__?.release===release, RELEASE,{timeout:30000});
              await page.waitForFunction(()=>Array.isArray(window.__originalClientProbe),undefined,{timeout:30000});
              const relevantControls = () => page.evaluate(() => [...document.querySelectorAll('button, a, [role="menuitem"], [role="tab"]')]
                .filter(node => node.getClientRects().length)
                .map(node => ({tag:node.tagName, role:node.getAttribute('role'), name:node.innerText?.trim().slice(0,70),
                  label:node.getAttribute('aria-label'), title:node.getAttribute('title'), testId:node.getAttribute('data-testid')}))
                .filter(x => x.name || x.label || x.title || x.testId).slice(0,90));
              await page.getByRole('button',{name:/探索|Explore/i}).first().waitFor({state:'visible',timeout:25000});
              const codexName = /^(?:(?:进入|切换至|切换到|打开|前往)\s*)?Codex(?:\s*模式)?$/i;
              const choice = page.getByRole('button',{name:codexName})
                .or(page.getByRole('link',{name:codexName}))
                .or(page.getByRole('menuitem',{name:codexName}))
                .or(page.getByRole('tab',{name:codexName})).filter({visible:true});
              let selected = choice.first();
              if (!(await selected.isVisible())) {
                stage('home-visible-controls', await relevantControls());
                const trigger = page.getByRole('button',{name:/^(?:探索|Explore)$/i}).filter({visible:true}).first();
                if (await trigger.isVisible()) await trigger.click();
                selected = choice.first();
                await selected.waitFor({state:'visible',timeout:10000}).catch(async error => {
                  stage('available-mode-controls', await relevantControls());
                  throw error;
                });
              }
              await selected.click();
              await page.waitForFunction(() =>
                (history.state?.usr?.sidebarProductMode ?? history.state?.sidebarProductMode) === 'codex',
                undefined,{timeout:17000});
              stage('selected-codex-in-the-original-home-interface');
              const composer = page.locator('main #prompt-textarea[contenteditable="true"], main .ProseMirror[contenteditable="true"], main textarea:not([disabled]), [data-testid="codex-composer"] [contenteditable="true"], textarea:not([disabled]), [role="textbox"][contenteditable="true"]').filter({visible:true}).first();
              await composer.waitFor({state:'visible',timeout:28000});
              stage('opened-the-codex-composer-without-selecting-a-project');
              async function send(prompt) {
                await composer.click();
                await page.keyboard.insertText(prompt);
                const sendButton = page.locator('#composer-submit-button, button[data-testid="send-button"], button[data-testid="composer-submit-button"], button[aria-label="发送"], button[aria-label="发送消息"], button[aria-label="发送提示"], button[aria-label="Send message"], button[aria-label="Send prompt"]')
                  .filter({visible:true}).first();
                const click = await sendButton.isVisible() && await sendButton.isEnabled();
                await Promise.all([
                  page.waitForRequest(isModel,{timeout:58000}),
                  click ? sendButton.click({timeout:15000}) : composer.press('Enter',{timeout:15000}),
                ]);
              }
              await send(query);
              stage('first-model-request');
              const saved = await page.waitForFunction(({sample,expected}) => {
                for (const key of Object.keys(localStorage).filter(key=>key.includes('cg-original-app-server:v1:account:'))) {
                  const data = JSON.parse(localStorage.getItem(key));
                  for (const thread of data.threads) {
                    if (thread.executionSurface !== 'codex' && thread.adapterMetadata?.conversationOrigin !== 'codex') continue;
                    for (const turn of thread.turns) {
                      if (turn.status !== 'completed' || !turn.items.some(item=>item.type==='userMessage'&&JSON.stringify(item.content).includes(sample))) continue;
                      const python = turn.items.filter(item => item.type==='mcpToolCall' && item.tool==='python');
                      const exact = python.find(item => item.result?.structuredContent?.stdout?.includes(expected) ||
                        item.result?.content?.some(part => part.type==='text' && part.text.includes(expected)));
                      if (exact && turn.items.some(item=>item.type==='agentMessage'&&item.text?.includes(expected))) {
                        return { runs:python.length, model:turn.model, effort:turn.reasoningEffort,
                          durationMs:turn.durationMs, hasRealToolOutput:true,
                          firstTextMs:Number.isFinite(turn.adapterMetadata.firstTextAtMs) ? turn.adapterMetadata.firstTextAtMs - turn.adapterMetadata.startedAtMs : null,
                          visibleMessageParts:turn.items.filter(item=>item.type==='agentMessage').length,
                          publicSummaryParts:turn.items.filter(item=>item.type==='reasoning').reduce((n,item)=>n+(item.summary?.length??0),0) };
                      }
                    }
                  }
                }
                return null;
              },{sample,expected},{timeout:135000});
              const turn = await saved.jsonValue();
              assert.equal(turn.model,'gpt-6.2-sol');
              assert.equal(turn.effort,'low');
              assert.equal(turn.runs,1);
              assert.ok(Number.isFinite(turn.durationMs) && turn.durationMs > 0);
              stage('python-output-and-final-answer-verified',turn);
              assert.ok(await page.locator('main').getByText(new RegExp(expected)).first().waitFor({state:'visible',timeout:12000}).then(()=>true));
              const threadPath = new URL(page.url()).pathname;
              await send(continuation);
              await page.locator('main').getByText(expected+'-NEXT',{exact:true}).first().waitFor({state:'visible',timeout:85000});
              assert.equal(new URL(page.url()).pathname,threadPath);
              assert.ok(inference.every(entry => entry.model==='gpt-6.2-sol' && entry.effort==='low'));
              stage('same-thread-contextual-follow-up-verified');
              const [logout] = await Promise.all([
                page.waitForResponse(r=>r.url()===API+'/auth/logout'&&r.request().method()==='POST',{timeout:22000}),
                page.goto(new URL('auth/logout/',home).href,{waitUntil:'domcontentloaded',timeout:30000}),
              ]);
              assert.ok(logout.ok());
              await page.waitForURL(u=>u.origin===home.origin&&u.pathname===home.pathname,{timeout:22000});
              stage('signed-out-on-original-base-path');
            } finally {
              const details = await page.evaluate(({sample})=>({
                mode:history.state?.usr?.sidebarProductMode ?? history.state?.sidebarProductMode ?? null,
                path:location.pathname.replace(/(\/(?:c|t)\/)[^/]+/,'$1<thread>'),
                release:window.__CHATGPT_REPLICA_ENV__?.release,
                text:document.body?.innerText.replaceAll(sample,'<qa-token>').slice(0,360),
                editors:[...document.querySelectorAll('textarea,[contenteditable="true"]')].slice(0,10).map(el=>[el.id,el.getAttribute('placeholder'),el.getAttribute('data-testid')]),
              }),{sample}).catch(()=>null);
              stage('details',{details,inference,errors});
            }
          } finally { await browser.close(); }
          NODE

