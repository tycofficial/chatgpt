name: Verify and stage the latest native client

on:
  push:
    branches: [qa/codex-public-summary-heading]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      DEPLOY_BASE: 75e94b87f4f59a77c482038e16bb9c8258169183
      VERIFIED_REF: refs/heads/qa/verified-native-summary-heading
    outputs:
      release: ${{ steps.export.outputs.release }}
      commit: ${{ steps.export.outputs.commit }}
      index_sha: ${{ steps.export.outputs.index_sha }}
      adapter_sha: ${{ steps.export.outputs.adapter_sha }}
      worker_sha: ${{ steps.export.outputs.worker_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 8
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install the repository dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and validate the native client
        run: |
          set -euo pipefail
          npm run release:prepare
          npm run native:check
          node --test --test-concurrency=2 tests/*.test.mjs
          git -c core.whitespace=cr-at-eol diff --check "$DEPLOY_BASE"
          git diff --exit-code "$DEPLOY_BASE" -- original-client _orbit-renderer
      - name: Compare the public upstream build if reachable
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const packaged = JSON.parse(readFileSync('native-client/active.json', 'utf8')).sourceBuild;
          try {
            const response = await fetch('https://chatgpt.com/', { redirect: 'follow', signal: AbortSignal.timeout(12000) });
            const upstream = response.ok && /\bdata-build="([a-f\d]{40})"/i.exec(await response.text())?.[1];
            console.log(JSON.stringify({ packaged, upstream: upstream || null, http: response.status, matches: upstream === packaged }));
          } catch (error) {
            console.log(JSON.stringify({ packaged, upstream: null, observation: error.name }));
          }
          NODE
      - id: export
        name: Push the checked release commit to the verification ref
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$DEPLOY_BASE" HEAD
          git rm -- .github/workflows/qa-stage-native-release.yml
          git add -u
          [[ -z "$(git ls-files --others --exclude-standard)" ]]
          [[ -z "$(git diff --cached --name-only "$DEPLOY_BASE" -- .github original-client _orbit-renderer)" ]]
          release="$(node -p "require('./native-client/active.json').release")"
          [[ "$release" =~ ^[a-f0-9]{16}$ ]]
          [[ "$release" != dea77d65adc42752 ]]
          tree="$(git write-tree)"
          packed="$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p "$DEPLOY_BASE" -m 'Serve the latest native homepage and retain public summary titles')"
          git push origin "$packed:$VERIFIED_REF"
          {
            printf 'release=%s\ncommit=%s\n' "$release" "$packed"
            printf 'index_sha=%s\n' "$(git cat-file blob "$packed:index.html" | sha256sum | cut -d' ' -f1)"
            printf 'adapter_sha=%s\n' "$(git cat-file blob "$packed:native-client/boot-adapter.mjs" | sha256sum | cut -d' ' -f1)"
            printf 'worker_sha=%s\n' "$(git cat-file blob "$packed:native-client-worker.js" | sha256sum | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
          printf 'Verified native release %s at %s\n' "$release" "$packed"

  public:
    name: Verify the original Pages site
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SITE: https://tycofficial.github.io/chatgpt/
      OLD_RELEASE: dea77d65adc42752
      OLD_SHELL: https://raw.githubusercontent.com/tycofficial/chatgpt/75e94b87f4f59a77c482038e16bb9c8258169183/index.html
      RELEASE: ${{ needs.package.outputs.release }}
      REVISION: ${{ needs.package.outputs.commit }}
      INDEX_SHA: ${{ needs.package.outputs.index_sha }}
      ADAPTER_SHA: ${{ needs.package.outputs.adapter_sha }}
      WORKER_SHA: ${{ needs.package.outputs.worker_sha }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Wait for the exact new Pages package
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/public-native"
          mkdir -p "$dir"
          deadline=$((SECONDS+600))
          found=0
          pull() { curl --fail --silent --show-error --connect-timeout 5 --max-time 12 --header 'Cache-Control: no-cache' "$1" -o "$2"; }
          while (( SECONDS < deadline )); do
            if pull "$SITE""native-client/active.json?release=$RELEASE" "$dir/active.json" 2>/dev/null &&
               jq -e --arg release "$RELEASE" '.active == true and .release == $release' "$dir/active.json" >/dev/null &&
               pull "$SITE" "$dir/index.html" 2>/dev/null &&
               grep -Fq "bootstrap.mjs?v=$RELEASE" "$dir/index.html" &&
               pull "$SITE""native-client/boot-adapter.mjs?v=$RELEASE" "$dir/boot-adapter.mjs" 2>/dev/null &&
               pull "$SITE""native-client-worker.js?v=$RELEASE" "$dir/native-client-worker.js" 2>/dev/null &&
               printf '%s  %s\n' "$INDEX_SHA" "$dir/index.html" "$ADAPTER_SHA" "$dir/boot-adapter.mjs" "$WORKER_SHA" "$dir/native-client-worker.js" | sha256sum -c --quiet; then
              found=1
              break
            fi
            sleep 7
          done
          [[ "$found" == 1 ]]
          jq -r '"Public release \(.release), component build \(.sourceBuild)"' "$dir/active.json"
          printf 'Verified byte-for-byte against commit %s\n' "$REVISION"
      - name: Open the Pages site in cloud Chromium and reopen with an old shell cached
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          [[ -n "$CHROME_BIN" ]]
          npm install --prefix "$RUNNER_TEMP/pages-browser" --no-audit --no-fund --package-lock=false playwright-core@1.58.2
          node --input-type=module <<'NODE'
          import { pathToFileURL } from 'node:url';
          import { join } from 'node:path';
          const { chromium } = await import(pathToFileURL(join(process.env.RUNNER_TEMP, 'pages-browser/node_modules/playwright-core/index.mjs')).href);
          const { SITE, RELEASE, OLD_RELEASE, OLD_SHELL, CHROME_BIN } = process.env;
          const old = await fetch(OLD_SHELL, { signal: AbortSignal.timeout(20000) });
          if (!old.ok) throw Error('The previous public shell could not be read');
          const previousShell = await old.text();
          if (!previousShell.includes('bootstrap.mjs?v=' + OLD_RELEASE)) throw Error('Unexpected previous shell');

          const browser = await chromium.launch({ executablePath: CHROME_BIN, headless: true, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
          try {
            const context = await browser.newContext();
            async function openCurrent(page) {
              await page.goto(SITE, { waitUntil: 'domcontentloaded', timeout: 55000 });
              await page.waitForFunction(release => {
                const running = performance.getEntriesByType('resource').some(resource => {
                  const url = new URL(resource.name);
                  return url.pathname.endsWith('/native-client/service-boundary.mjs') && url.searchParams.get('v') === release;
                });
                return running && Boolean(document.querySelector('#prompt-textarea,[data-testid="prompt-textarea"]'));
              }, RELEASE, { timeout: 65000 });
            }

            const first = await context.newPage();
            await openCurrent(first);
            console.log('Cold navigation mounted the composer and loaded release ' + RELEASE);
            await first.waitForFunction(release => {
              const controller = navigator.serviceWorker?.controller;
              return controller && new URL(controller.scriptURL).searchParams.get('v') === release;
            }, RELEASE, { timeout: 20000 });
            await first.evaluate(async ({ release, previousShell }) => {
              const cache = await caches.open('chatgpt-native-shell-' + release);
              await cache.put(new URL('index.html', location.href).href,
                new Response(previousShell, { headers: { 'Content-Type': 'text/html' } }));
            }, { release: RELEASE, previousShell });

            const reopened = await context.newPage();
            await openCurrent(reopened);
            console.log('Normal reopening loaded release ' + RELEASE + ' with the previous shell in CacheStorage');
          } finally {
            await browser.close();
          }
          NODE
