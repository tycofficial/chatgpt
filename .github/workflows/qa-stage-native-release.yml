name: Verify the latest native release at the original public URL
on:
  push:
    branches: [qa/codex-public-summary-heading]
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SITE: https://tycofficial.github.io/chatgpt/
      RELEASE: 923e7f59b16a7c09
      OLD_RELEASE: bfb322d68717147e
      OLD_SHELL: https://raw.githubusercontent.com/tycofficial/chatgpt/b020a4a479cad1bc93614537e8881831ffca71ba/index.html
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Reopen the live site and inspect original browser controls
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          npm install --prefix "$RUNNER_TEMP/pages-browser" --no-audit --no-fund --package-lock=false playwright-core@1.58.2
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { pathToFileURL } from 'node:url';
          import { join } from 'node:path';
          const { chromium } = await import(pathToFileURL(join(process.env.RUNNER_TEMP, 'pages-browser/node_modules/playwright-core/index.mjs')).href);
          const { SITE, RELEASE, OLD_RELEASE, OLD_SHELL, CHROME_BIN } = process.env;
          const live = new URL(SITE);
          const source = "https://raw.githubusercontent.com/tycofficial/chatgpt/5bf184c020fc9a52257cabe6f361e817e04d2049/";
          const sha = buffer => createHash('sha256').update(Buffer.from(buffer)).digest('hex');
          const paths = [['', 'index.html'], ['native-client/boot-adapter.mjs?v=' + RELEASE, 'native-client/boot-adapter.mjs'],
            ['native-client-worker.js?v=' + RELEASE, 'native-client-worker.js']];
          await Promise.all(paths.map(async ([address, file]) => {
            const [published, expected] = await Promise.all([
              fetch(new URL(address, live), { cache: 'no-store', signal: AbortSignal.timeout(18000) }),
              fetch(new URL(file, source), { signal: AbortSignal.timeout(18000) }),
            ]);
            assert.equal(published.status, 200);
            assert.equal(expected.status, 200);
            assert.equal(sha(await published.arrayBuffer()), sha(await expected.arrayBuffer()), file + ' differs from the deployed commit');
            console.log('Published bytes match ' + file);
          }));
          const [old, active] = await Promise.all([
            fetch(OLD_SHELL, { signal: AbortSignal.timeout(15000) }),
            fetch(new URL('native-client/active.json?browser_qa=' + RELEASE, live), { signal: AbortSignal.timeout(15000) }),
          ]);
          assert.equal(old.status, 200);
          assert.equal(active.status, 200);
          assert.equal((await active.json()).release, RELEASE);
          const oldShell = await old.text();
          assert.ok(oldShell.includes('bootstrap.mjs?v=' + OLD_RELEASE));
          const browser = await chromium.launch({ executablePath: CHROME_BIN, headless: true, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
          try {
            const context = await browser.newContext({ locale: 'zh-CN' });
            await context.addInitScript(() => performance.setResourceTimingBufferSize(6000));
            const timeline = [];
            const failures = [];
            function observe(page, phase) {
              page.on('response', res => {
                const url = new URL(res.url());
                if (url.origin !== live.origin) return;
                const status = res.status();
                if (res.request().isNavigationRequest() || /\/(?:bootstrap|service-boundary|boot-adapter)\.mjs$/.test(url.pathname)) {
                  const entry = { phase, path: url.pathname, release: url.searchParams.get('v'), status, worker: res.fromServiceWorker() };
                  timeline.push(entry);
                  console.log('Browser response ' + JSON.stringify(entry));
                }
                if (status >= 400 && failures.length < 24) failures.push([phase, status, url.pathname]);
              });
              page.on('requestfailed', req => {
                const url = new URL(req.url());
                if (failures.length < 24) failures.push([phase, req.failure()?.errorText, url.host + url.pathname]);
              });
              page.on('pageerror', error => {
                if (failures.length < 24) failures.push([phase, error.name, error.message.slice(0, 300)]);
              });
              page.on('console', message => {
                if (message.type() === 'error' && failures.length < 24) failures.push([phase, 'console', message.text().slice(0, 300)]);
              });
            }
            const summary = page => page.evaluate(() => {
              const html = document.documentElement, env = window.__CHATGPT_REPLICA_ENV__;
              const text = document.body?.innerText?.replace(/\s+/g, ' ').trim().slice(0, 360);
              const controls = Array.from(document.querySelectorAll('button, a, input, [contenteditable="true"]'))
                .slice(0, 32).map(el => [el.tagName, el.getAttribute('data-testid'), el.getAttribute('aria-label'), el.innerText?.trim().slice(0, 42)]);
              return { path: location.pathname, title: document.title, shell: html.dataset.nativeClientRelease,
                runtime: env?.release, worker: navigator.serviceWorker?.controller?.scriptURL,
                siteAuth: html.dataset.siteAuth, bootAdapterReached: Array.isArray(window.__originalClientProbe), text, controls };
            });
            async function openHome(page, phase) {
              observe(page, phase);
              const response = await page.goto(SITE, { waitUntil: 'domcontentloaded', timeout: 45000 });
              assert.equal(response?.status(), 200, 'The ordinary home URL returned an error');
              assert.ok((await response.text()).includes('bootstrap.mjs?v=' + RELEASE),
                'The navigation delivered an older homepage before any page-side refresh');
              await page.waitForFunction(release => globalThis.__CHATGPT_REPLICA_ENV__?.release === release, RELEASE, { timeout: 20000 });
              await page.waitForFunction(() => Array.isArray(window.__originalClientProbe), undefined, { timeout: 20000 });
            }
            async function controller(page) {
              await page.waitForFunction(release => {
                const worker = navigator.serviceWorker?.controller;
                return worker && new URL(worker.scriptURL).searchParams.get('v') === release;
              }, RELEASE, { timeout: 20000 });
            }
            const first = await context.newPage();
            let reopened, login;
            try {
              await openHome(first, 'cold');
              await controller(first);
              console.log('Cold homepage matches the deployed HTML, ran the new bootstrap and is controlled by its worker.');
              await first.evaluate(async ({ release, oldShell }) => {
                const cache = await caches.open('chatgpt-native-shell-' + release);
                const key = new URL('index.html', location.href).href;
                await cache.put(key, new Response(oldShell, { headers: { 'Content-Type': 'text/html' } }));
                if (!(await (await cache.match(key)).text()).includes('bootstrap.mjs?v=bfb322d68717147e')) throw Error('Old homepage fixture not present');
              }, { release: RELEASE, oldShell });
              reopened = await context.newPage();
              await openHome(reopened, 'old-cache');
              await controller(reopened);
              assert.ok(timeline.some(event => event.phase === 'old-cache' && event.path === live.pathname && event.worker),
                'Returning navigation did not reach the service worker');
              console.log('Returning homepage served the current release through the worker with a previous shell in CacheStorage.');

              login = await context.newPage();
              observe(login, 'login');
              await login.goto(new URL('auth/login/', live).href, { waitUntil: 'domcontentloaded', timeout: 35000 });
              await login.locator('input#site-username').waitFor({ state: 'visible', timeout: 20000 });
              await login.locator('input#site-password').waitFor({ state: 'visible', timeout: 10000 });
              await login.getByRole('button', { name: '继续', exact: true }).waitFor({ state: 'visible', timeout: 10000 });
              console.log('The current published login page rendered its account form.');
              await login.getByRole('button', { name: '以本机访客继续', exact: true }).click();
              await login.locator('#prompt-textarea, .ProseMirror[contenteditable=true], [data-testid="prompt-textarea"]').first().waitFor({ state: 'visible', timeout: 40000 });
              console.log('The published guest chat opened and its composer is visible.');
            } finally {
              for (const [name, tab] of [['cold', first], ['old-cache', reopened], ['login-or-guest', login]]) {
                if (tab) console.log('Browser state ' + name + ': ' + JSON.stringify(await summary(tab).catch(() => null)));
              }
              console.log('Browser diagnostic events: ' + JSON.stringify(failures));
            }
          } finally {
            await browser.close();
          }
          NODE

  edge:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      SITE: https://tycofficial.github.io/chatgpt/
      API: https://chatgpt-admin-bridge-tyc.hushedtarragon1.chatgpt.site
      RELEASE: 923e7f59b16a7c09
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Use real login and inference through the published website
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pages-browser" --no-audit --no-fund --package-lock=false playwright-core@1.58.2
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { randomUUID } from 'node:crypto';
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { chromium } = await import(pathToFileURL(join(process.env.RUNNER_TEMP, 'pages-browser/node_modules/playwright-core/index.mjs')).href);
          const { SITE, API, RELEASE } = process.env;
          const home = new URL(SITE);
          const id = randomUUID().replace(/-/g, '').slice(0, 10);
          const username = 'qaedge' + id;
          const password = 'Qa9edge' + randomUUID().replace(/-/g, '');
          const marker = 'EDGE-QA-' + id;
          const first = 'For a browser recovery test, reply with exactly ' + marker + ' and no other text.';
          const second = 'Reply with only the exact token from your previous answer with -NEXT appended.';
          const requests = [];
          const syncTraffic = [];
          const errors = [];
          const stage = name => console.log('Edge QA ' + name);
          const composer = page => page.locator('#prompt-textarea[contenteditable="true"], .ProseMirror[contenteditable="true"]').first();
          const message = (page, text) => page.locator('main').getByText(text, { exact: true });
          const isInference = request => request.method() === 'POST' &&
            request.url() === API + '/inference/v1/responses';
          function attach(page) {
            page.on('response', response => {
              const url = new URL(response.url()), method = response.request().method();
              if (url.origin === API && url.pathname.startsWith('/sync/') && method !== 'OPTIONS') {
                const followedUp = method === 'PUT' && (response.request().postData() ?? '').includes(marker + '-NEXT');
                syncTraffic.push({ method, status: response.status(), followedUp, path: url.pathname.replace(/conversations\/[^/]+$/, 'conversations/<thread>') });
              }
              if (!response.request().isNavigationRequest() || url.origin !== home.origin) return;
              console.log('Edge navigation ' + JSON.stringify({ path: url.pathname.replace(new RegExp('/c/[^/]+'), '/c/<thread>'),
                status: response.status(), worker: response.fromServiceWorker() }));
            });
            page.on('request', request => {
              if (!isInference(request)) return;
              const body = request.postDataJSON();
              const number = requests.length + 1;
              requests.push({ id: request.headers()['x-chat-request-id'] ?? null, model: body?.model ?? null, effort: body?.reasoning?.effort ?? null });
              console.log('Edge model POST ' + JSON.stringify({ number, model: body?.model, effort: body?.reasoning?.effort ?? null }));
            });
            page.on('pageerror', error => { if (errors.length < 12) errors.push(error.name); });
          }
          async function account(page, entry) {
            const target = new URL('auth/' + entry + '/', home);
            await page.goto(target.href, { waitUntil: 'domcontentloaded', timeout: 43000 });
            await page.locator('#site-username').fill(username);
            await page.locator('#site-password').fill(password);
            const accountMethod = entry === 'signup' ? 'register' : 'login';
            const receipt = page.waitForResponse(response => response.url() === API + '/auth/' + accountMethod &&
              response.request().method() === 'POST', { timeout: 42000 });
            await page.getByRole('button', {name: '继续', exact: true}).click();
            const accountResponse = await receipt;
            assert.equal(accountResponse.status(), 200, 'Account operation failed');
            await page.waitForURL(url => url.origin === home.origin && url.pathname === home.pathname, { timeout: 45000 });
            await composer(page).waitFor({ state: 'visible', timeout: 45000 });
            const plan = await page.evaluate(async release => {
              const account = await import('./native-client/site-account.mjs?v=' + release);
              const user = account.getSiteAccount() ?? await account.refreshSiteAccount();
              return { type: user?.planType, verified: user?.cloudSessionVerified };
            }, RELEASE);
            assert.deepEqual(plan, { type: 'free', verified: true });
            stage('account-plan-free-' + entry);
            const release = await page.evaluate(() => window.__CHATGPT_REPLICA_ENV__?.release);
            assert.equal(release, RELEASE);
          }
          async function send(page, prompt) {
            const editor = composer(page);
            await editor.click();
            await editor.pressSequentially(prompt);
            assert.ok((await editor.innerText()).includes(prompt), 'The composer did not receive the typed test message');
            const controls = await editor.evaluate(element => {
              const parent = element.closest('form') ?? element.closest('[data-type="unified-composer"]');
              return [...(parent?.querySelectorAll('button') ?? [])].slice(0, 20).map(btn =>
                ({ id: btn.id, label: btn.getAttribute('aria-label'), test: btn.getAttribute('data-testid'), disabled: btn.disabled }));
            });
            console.log('Edge composer controls ' + JSON.stringify(controls));
            const btn = page.locator('#composer-submit-button, button[data-testid="send-button"], button[data-testid="composer-submit-button"], button[aria-label="发送"], button[aria-label="发送消息"], button[aria-label="发送提示"], button[aria-label="Send message"], button[aria-label="Send prompt"]').filter({ visible: true }).first();
            const click = await btn.isVisible() && await btn.isEnabled();
            await Promise.all([
              page.waitForRequest(isInference, { timeout: 45000 }),
              click ? btn.click({ timeout: 15000 }) : editor.press('Enter', { timeout: 15000 }),
            ]);
          }
          async function state(page, stage, expectedThread, token) {
            const snapshot = await page.evaluate(({ expectedThread, token }) => {
              const records = Object.keys(localStorage).filter(key => key.includes('cg-original-app-server:v1'));
              const persistence = records.map(key => {
                try {
                  const doc = JSON.parse(localStorage.getItem(key));
                  const thread = doc.threads.find(thread => thread.id === expectedThread);
                  const last = thread?.turns?.at(-1);
                  return { namespace: key.includes(':account:') ? 'account' : key.includes(':guest') ? 'guest' : 'local',
                    threads: doc.threads.length, matched: Boolean(thread), lastStatus: last?.status,
                    replySaved: last?.items?.some(item => item.type === 'agentMessage' && item.text?.includes(token)) ?? false,
                    checkpointSaved: Boolean(last?.adapterMetadata?.checkpoint?.inFlight) };
                } catch { return { unreadable: true }; }
              });
              const path = location.pathname, main = document.querySelector('main');
              return { path: path.replace(new RegExp('/c/[^/]+'), '/c/<thread>'),
                correctThread: path.split('/').filter(Boolean).at(-1) === expectedThread,
                release: window.__CHATGPT_REPLICA_ENV__?.release, boot: Boolean(window.__originalClientProbe),
                worker: Boolean(navigator.serviceWorker?.controller), title: document.title,
                body: document.body?.innerText.replaceAll(token, '<test-token>').slice(0, 260),
                mainHasReply: main?.innerText.includes(token) ?? false, persistence };
            }, { expectedThread, token });
            console.log('Edge page state ' + JSON.stringify({stage, ...snapshot}));
          }
          async function cloudState(page, stage, threadId) {
            const result = await page.evaluate(async threadId => {
              const diagnostics = (window.__originalClientProbe ?? []).filter(v =>
                typeof v?.type === 'string' && /(?:history|sync|storage)/i.test(v.type)).slice(-24)
                .map(v => ({ type: v.type, code: typeof v.code === 'string' ? v.code : undefined }));
              const database = 'chatgpt-site-history-sync-v1';
              if (!(await indexedDB.databases()).some(db => db.name === database)) return { diagnostics, dbPresent: false };
              const states = await new Promise((resolve, reject) => {
                const op = indexedDB.open(database);
                op.onerror = () => reject(op.error);
                op.onsuccess = () => {
                  const db = op.result;
                  const tx = db.transaction('owners', 'readonly');
                  const get = tx.objectStore('owners').getAll();
                  get.onerror = () => reject(get.error);
                  get.onsuccess = () => resolve(get.result.map(own => ({
                    head: Boolean(own.heads?.[threadId]), revision: own.known?.[threadId]?.revision ?? 0,
                    pending: (own.outbox ?? []).filter(m => m.id === threadId).map(m => ({ method: m.method, attempted: m.attempted, blocked: m.blocked })),
                    conflict: own.conflicts?.[threadId]?.reason ?? null,
                  })));
                  tx.oncomplete = () => db.close();
                };
              });
              return { diagnostics, dbPresent: true, states };
            }, threadId);
            console.log('Edge cloud history ' + JSON.stringify({ stage, ...result }));
          }
          const manifest = await fetch(new URL('native-client/active.json?edge_qa=' + RELEASE, home), { signal: AbortSignal.timeout(18000) });
          assert.equal((await manifest.json()).release, RELEASE);
          const browser = await chromium.launch({ channel: 'msedge', headless: true });
          try {
            const context = await browser.newContext({ locale: 'zh-CN' });
            let tab = await context.newPage();
            attach(tab);
            await account(tab, 'signup');
            stage('registered-and-opened-the-current-free-chat');
            await send(tab, first);
            stage('first-model-request-sent');
            await tab.waitForURL(url => /^\/chatgpt\/c\/[^/]+\/?$/.test(url.pathname), { timeout: 20000 });
            await message(tab, first).waitFor({state: 'visible', timeout: 15000});
            await tab.waitForFunction(() => {
              const id = location.pathname.split('/').filter(Boolean).at(-1);
              return Object.keys(localStorage).filter(key => key.includes('cg-original-app-server:v1:account:')).some(key => {
                try { return JSON.parse(localStorage.getItem(key)).threads.some(thread => thread.id === id); }
                catch { return false; }
              });
            }, undefined, { timeout: 19000 });
            const requestedThread = tab.url(), requestedId = new URL(requestedThread).pathname.split('/').filter(Boolean).at(-1);
            stage('native-accepted-conversation-address');
            const before = await message(tab, marker).count();
            await tab.reload({waitUntil: 'domcontentloaded', timeout: 43000});
            try {
              await message(tab, marker).waitFor({ state: 'visible', timeout: 38000 });
            } catch (error) {
              await state(tab, 'reply-not-visible-after-reload', requestedId, marker);
              await cloudState(tab, 'first-reload-missing-reply', requestedId);
              throw error;
            }
            assert.equal(await message(tab, first).count(), 1);
            assert.equal(await message(tab, marker).count(), 1);
            assert.equal(requests.length, 1, 'Pre-reload send repeated');
            stage(before ? 'reloaded-and-restored-completed-reply' : 'reloaded-while-reply-pending-and-restored-it');

            const thread = tab.url();
            const threadId = new URL(thread).pathname.split('/').filter(Boolean).at(-1);
            assert.match(new URL(thread).pathname, /^\/chatgpt\/c\/[^/]+\/?$/);
            console.log('Edge changed thread address after recovery ' + String(thread !== requestedThread));
            await state(tab, 'before-close', threadId, marker);
            await tab.close();
            tab = await context.newPage();
            attach(tab);
            await tab.goto(thread, {waitUntil: 'domcontentloaded', timeout: 43000});
            let directReopen = true;
            try {
              await message(tab, marker).waitFor({ state: 'visible', timeout: 22000 });
              stage('closed-and-reopened-the-same-chat');
            } catch {
              directReopen = false;
              await state(tab, 'direct-reopen-failed', threadId, marker);
              await tab.goto(SITE, {waitUntil: 'domcontentloaded', timeout: 43000});
              await composer(tab).waitFor({state:'visible', timeout: 30000});
              const title = first.slice(0, 80);
              const candidate = tab.getByText(title, { exact: true }).first();
              await candidate.click({timeout: 20000});
              await message(tab, marker).waitFor({ state: 'visible', timeout: 45000 });
              stage('closed-and-reopened-the-chat-from-history');
            }
            await state(tab, 'after-reopen', threadId, marker);
            assert.equal(requests.length, 1);

            await context.setOffline(true);
            try {
              assert.equal(await tab.evaluate(() => navigator.onLine), false);
              await message(tab, marker).waitFor({state: 'visible', timeout: 10000});
            } finally {
              await context.setOffline(false);
            }
            await tab.waitForFunction(() => navigator.onLine, undefined, {timeout: 12000});
            await send(tab, second);
            await message(tab, marker + '-NEXT').waitFor({ state: 'visible', timeout: 90000 });
            assert.equal(await message(tab, second).count(), 1);
            assert.equal(await message(tab, marker + '-NEXT').count(), 1);
            assert.equal(requests.length, 2);
            assert.equal(new Set(requests.map(request => request.id)).size, 2);
            assert.ok(requests.every(request => request.id));
            assert.equal(new URL(tab.url()).pathname, new URL(thread).pathname);
            stage('reconnected-and-sent-one-contextual-follow-up');
            await state(tab, 'before-cross-device', threadId, marker + '-NEXT');
            await cloudState(tab, 'after-follow-up', threadId);
            for (let i = 0; i < 25 && !syncTraffic.some(entry => entry.method === 'PUT' && entry.status >= 200 && entry.status < 300 && entry.followedUp); i++) {
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
            await cloudState(tab, 'before-second-profile', threadId);

            const secondContext = await browser.newContext({ locale: 'zh-CN' });
            const other = await secondContext.newPage();
            attach(other);
            await account(other, 'login');
            stage('logged-in-from-a-separate-browser-profile');
            await other.goto(thread, { waitUntil: 'domcontentloaded', timeout: 43000 });
            let crossDeviceRecovered = true;
            try {
              await message(other, marker + '-NEXT').waitFor({state: 'visible', timeout: 25000});
              assert.equal(await message(other, marker).count(), 1);
              assert.equal(requests.length, 2);
              stage('recovered-the-account-chat-from-a-separate-profile');
            } catch {
              crossDeviceRecovered = false;
              stage('the-separate-profile-did-not-display-the-synced-chat');
              await state(other, 'cross-device-missing', threadId, marker + '-NEXT');
              await cloudState(other, 'second-profile', threadId);
            }

            const loggedOut = other.waitForResponse(response => response.url() === API + '/auth/logout' && response.request().method() === 'POST', {timeout: 22000});
            const [logoutResponse] = await Promise.all([
              loggedOut,
              other.goto(new URL('auth/logout/', home).href, {waitUntil: 'domcontentloaded', timeout: 30000})
            ]);
            assert.ok(logoutResponse.ok());
            await other.waitForURL(url => url.origin === home.origin && url.pathname === home.pathname, {timeout: 22000});
            stage('signed-out-and-stayed-on-chatgpt-base-path');
            assert.equal(directReopen, true, 'The conversation could only be reopened from the home history');
            assert.equal(crossDeviceRecovered, true, 'The separate profile did not load the expected conversation');
          } finally {
            console.log('Edge sync traffic ' + JSON.stringify(syncTraffic.slice(-40)));
            console.log('Edge requests ' + JSON.stringify({ inferencePosts: requests.length, distinctIds: new Set(requests.map(v => v.id)).size, pageErrorTypes: errors }));
            await browser.close();
          }
          NODE

  mainland:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      RELEASE: 923e7f59b16a7c09
      API_HOST: chatgpt-admin-bridge-tyc.hushedtarragon1.chatgpt.site
    steps:
      - name: Probe public HTTPS and API preflight from China
        run: |
          node --input-type=module <<'NODE'
          import { setTimeout as wait } from 'node:timers/promises';
          const base = 'https://api.globalping.io';
          const origin = 'https://tycofficial.github.io';
          const host = new URL(origin).hostname;
          const apiHost = process.env.API_HOST;
          const options = {
            Origin: origin,
            'Access-Control-Request-Method': 'POST',
            'Access-Control-Request-Headers': 'content-type',
          };
          const headers = { 'User-Agent': 'tycofficial-chatgpt-pages-availability/1.0', accept: 'application/json' };
          const cases = [
            ['home', host, { method: 'GET', path: '/chatgpt/' }],
            ['login-page', host, { method: 'GET', path: '/chatgpt/auth/login/' }],
            ['release-manifest', host, { method: 'GET', path: '/chatgpt/native-client/active.json', query: 'v=' + process.env.RELEASE }],
            ['login-api', apiHost, { method: 'OPTIONS', path: '/auth/login', headers: options }],
            ['inference-api', apiHost, { method: 'OPTIONS', path: '/inference/v1/responses',
              headers: { ...options, 'Access-Control-Request-Headers': 'authorization,content-type,x-chat-request-id' } }],
          ];
          function classify(text) {
            if (/reset|ECONNRESET/i.test(text)) return 'connection reset';
            if (/timed? ?out|ETIMEDOUT/i.test(text)) return 'timeout';
            if (/SSL|TLS|certificate/i.test(text)) return 'TLS failure';
            if (/ENOTFOUND|EAI_AGAIN|not resolve|DNS/i.test(text)) return 'DNS failure';
            if (/refused|ECONNREFUSED/i.test(text)) return 'connection refused';
            return null;
          }
          async function probe([name, target, request], pinned) {
            try {
              const input = { type: 'http', target, locations: [{ ...(pinned ? { magic: pinned } : { country: 'CN' }), limit: 3 }],
                measurementOptions: { protocol: 'HTTPS', request } };
              const created = await fetch(base + '/v1/measurements', { method: 'POST', body: JSON.stringify(input),
                headers: { ...headers, 'Content-Type': 'application/json' }, signal: AbortSignal.timeout(12000) });
              const token = await created.json();
              if (created.status !== 202 || !/^[A-Za-z0-9_-]+$/.test(token.id ?? '')) {
                console.log(JSON.stringify({ name, serviceStatus: created.status, issue: token.error?.type ?? null,
                  message: JSON.stringify(token.error?.message ?? '').slice(0, 170) }));
                return null;
              }
              let result = {};
              for (let i = 0; i < 18; i++) {
                const response = await fetch(base + '/v1/measurements/' + token.id, { headers, signal: AbortSignal.timeout(8000) });
                result = await response.json();
                if (result.status === 'finished') break;
                await wait(1000);
              }
              const rows = (result.results ?? []).map(({ probe, result }) => ({
                country: probe.country, city: probe.city, network: probe.network, asn: probe.asn,
                http: result.statusCode ?? null, status: result.status, ms: result.timings?.total ?? null,
                failure: result.statusCode == null ? classify(result.rawOutput ?? '') : null,
                ...(name === 'release-manifest' ? { currentRelease: (result.rawBody ?? '').includes(process.env.RELEASE) } : {}),
              }));
              console.log(JSON.stringify({ name, id: token.id, status: result.status, rows }));
              return rows.some(row => row.country === 'CN') ? token.id : null;
            } catch (error) {
              console.log(JSON.stringify({ name, measurementError: error.name, code: error.cause?.code ?? null }));
              return null;
            }
          }
          const outside = await Promise.all(cases.slice(-2).map(async ([name, host, request]) => {
            try {
              const response = await fetch(new URL(request.path, 'https://' + host), { method: request.method,
                headers: request.headers, signal: AbortSignal.timeout(12000) });
              return {name, http: response.status};
            } catch (error) { return {name, failure: error.cause?.code ?? error.name}; }
          }));
          console.log('Control from the GitHub runner: ' + JSON.stringify(outside));
          const first = await probe(cases[0], null);
          await Promise.all(cases.slice(1).map(test => probe(test, first)));
          NODE

  codex:
