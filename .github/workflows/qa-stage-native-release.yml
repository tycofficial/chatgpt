              stage('python-output-and-final-answer-verified',turn);
              assert.ok(await page.locator('main').getByText(new RegExp(expected)).first().waitFor({state:'visible',timeout:12000}).then(()=>true));
              assert.ok(inference.every(entry => entry.model==='gpt-6.2-sol' && entry.effort==='low'));
              const [logout] = await Promise.all([
                page.waitForResponse(r=>r.url()===API+'/auth/logout'&&r.request().method()==='POST',{timeout:22000}),
