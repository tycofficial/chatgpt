name: Diagnose the original product selector on the deployed site
on:
  push:
    branches: [qa/codex-public-summary-heading]
permissions:
  contents: read
jobs:
  codex:
    runs-on: windows-2025
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    env:
      SITE: https://tycofficial.github.io/chatgpt/
      API: https://chatgpt-admin-bridge-tyc.hushedtarragon1.chatgpt.site
      RELEASE: 3627b234b2f18cbf
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Use the site's real Pro trial and stock Codex interface
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pages-browser" --no-audit --no-fund --package-lock=false playwright-core@1.58.2
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { randomUUID } from 'node:crypto';
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { chromium } = await import(pathToFileURL(join(process.env.RUNNER_TEMP, 'pages-browser/node_modules/playwright-core/index.mjs')).href);
          const { SITE, API, RELEASE } = process.env;
          const home = new URL(SITE), nonce = randomUUID().replace(/-/g, '').slice(0, 10);
          const username = 'qacodex' + nonce, password = 'Qa9codex' + randomUUID().replace(/-/g, '');
          const sample = 'CODEXQA-' + nonce, expected = sample + '-323';
          const query = '请用 Python 工具实际执行 print("' + sample + '-" + str(17 * 19))。执行完后回复实际输出。';
          const continuation = '请回复上一次实际 Python 输出的完整第一行，并追加 -NEXT。只输出这一行。';
          const stage = (name, detail) => console.log('Codex QA ' + name + (detail === undefined ? '' : ' ' + JSON.stringify(detail)));
          async function post(path, data, token) {
            const result = await fetch(API + path, { method:'POST',
              headers: { Origin: home.origin, 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
              body: JSON.stringify(data), signal: AbortSignal.timeout(22000) });
            assert.equal(result.status, 200, path + ' refused the QA account operation');
            return result.json();
          }
          const active = await fetch(new URL('native-client/active.json?codex_qa=' + RELEASE, home), { signal: AbortSignal.timeout(18000) });
          assert.equal((await active.json()).release, RELEASE);
          const assigned = await post('/auth/register', { username, password });
          assert.equal(assigned.user?.planType, 'free');
          const trial = await post('/auth/site-trial', { tier:'pro' }, assigned.token);
          assert.equal(trial.user?.planType, 'pro');
          assert.equal(trial.user?.siteTrial?.tier, 'pro');
          stage('activated-a-normal-site-pro-trial');

          const localPath = new URL('native-client/local-codex-adapter.mjs?v='+RELEASE, home);
          const adapterResponse = await fetch(localPath, {signal:AbortSignal.timeout(17000)});
          assert.equal(adapterResponse.status,200);
          let adapter = await adapterResponse.text();
          function recordAt(functionName, probe) {
            const start = adapter.indexOf('function '+functionName+'(');
            const insertion = 'const current = state();';
            const end = adapter.indexOf(insertion,start) + insertion.length;
            if(start<0 || end<start) throw Error('Missing '+functionName);
            adapter = adapter.slice(0,end) + '\n  (globalThis.__codexModeProbe ??= []).push('+probe+');\n' + adapter.slice(end);
          }
          recordAt('resolveBrowserCapability', '{ name:"capability", local:current.local, configured:current.configuredTextProvider, selection:current.modelSelectionVerified, supportedBrowser, loading:originalDecision?.isLoading, error:originalDecision?.isError, auth:inputs?.authLoading, account:inputs?.accountLoading, accountMatch:inputs?.accountId===current.identity?.accountId, verifiedAccountMatch:inputs?.authenticatedAccountId===current.identity?.accountId, userMatch:inputs?.userId===current.identity?.userId }');
          recordAt('featureGateEntries', '{name:"gates", local:current.local, configured:current.configuredTextProvider, selection:current.modelSelectionVerified}');
          const stockURL = new URL('original-client/public/chatgpt.com/cdn/assets/76629.a6013c50b6.js', home);
          const stockResponse = await fetch(stockURL, {signal:AbortSignal.timeout(17000)});
          if (stockResponse.ok) {
            const stock = await stockResponse.text();
            const i = stock.indexOf('dZk8:');
            if (i >= 0) {
              const module = stock.slice(i, i + 11000);
              stage('original-sidebar-metadata',{productMode:module.includes('sidebarProductMode'), stringLabels:[...module.matchAll(/defaultMessage:"([^"]+)"/g)].map(m=>m[1]).filter(v=>v.length<100).slice(0,24),
                gateIds:[...new Set([...module.matchAll(/"([0-9]{9,10})"/g)].map(m=>m[1]))].slice(0,18)});
            }
          }
          const browser = await chromium.launch({ channel: 'msedge', headless: true });
          const inference = [], errors = [];
          const isModel = request => request.method() === 'POST' && request.url() === API + '/inference/v1/responses';
          try {
            const context = await browser.newContext({ locale:'zh-CN', serviceWorkers:'block' });
            await context.route(url => url.origin===home.origin && url.pathname===localPath.pathname,
              route => route.fulfill({status:200,body:adapter,contentType:'application/javascript; charset=utf-8'}));
            const page = await context.newPage();
            page.on('request', request => {
              if (!isModel(request)) return;
              const body = request.postDataJSON();
              inference.push({ model: body?.model, effort:body?.reasoning?.effort, tier:body?.service_tier,
                python:body?.tools?.some(tool => (tool.name ?? tool.function?.name) === 'python') });
            });
            page.on('pageerror', error => { if (errors.length < 10) errors.push(error.name); });
            try {
              await page.goto(new URL('auth/login/',home).href,{waitUntil:'domcontentloaded',timeout:40000});
              await page.locator('#site-username').fill(username);
              await page.locator('#site-password').fill(password);
              const [reply] = await Promise.all([
                page.waitForResponse(r=>r.url()===API+'/auth/login'&&r.request().method()==='POST',{timeout:35000}),
                page.getByRole('button',{name:'继续',exact:true}).click(),
              ]);
              assert.equal((await reply.json()).user?.planType,'pro');
              await page.waitForURL(url=>url.origin===home.origin&&url.pathname===home.pathname,{timeout:40000});
              await page.waitForFunction(release=>window.__CHATGPT_REPLICA_ENV__?.release===release, RELEASE,{timeout:30000});
              await page.waitForFunction(()=>Array.isArray(window.__originalClientProbe),undefined,{timeout:30000});
              await page.getByRole('button',{name:'聊天',exact:true}).first().waitFor({state:'visible',timeout:25000});
              async function capture(phase) {
                stage(phase,await page.evaluate(() => ({
                  path:location.pathname,
                  historyMode:history.state?.usr?.sidebarProductMode ?? history.state?.sidebarProductMode ?? null,
                  probes:[...new Map((window.__codexModeProbe ?? []).map(row=>[JSON.stringify(row),row])).values()].slice(0,30),
                  buttons:[...document.querySelectorAll('button')].filter(el=>el.getClientRects().length)
                    .map(el=>[el.innerText?.trim(), el.getAttribute('aria-label'),el.getAttribute('data-testid')])
                    .filter(el=>el.some(Boolean)).slice(0,42),
                })));
              }
              await capture('mounted-home');
              const work = page.getByRole('button',{name:'工作',exact:true}).filter({visible:true}).first();
              if (await work.isVisible()) await work.click();
              await new Promise(resolve=>setTimeout(resolve,2500));
              await capture('mode-after-the-work-control');
              const profile = page.getByRole('button',{name:'打开个人资料菜单',exact:true}).first();
              if (await profile.isVisible()) await profile.click();
              await new Promise(resolve=>setTimeout(resolve,600));
              await capture('mode-entries-in-the-profile-menu');
            } finally {
              const details = await page.evaluate(({sample})=>({
                path:location.pathname.replace(/(\/(?:c|t)\/)[^/]+/,'$1<thread>'),
                release:window.__CHATGPT_REPLICA_ENV__?.release,
                text:document.body?.innerText.replaceAll(sample,'<qa-token>').slice(0,360),
                editors:[...document.querySelectorAll('textarea,[contenteditable="true"]')].slice(0,10).map(el=>[el.id,el.getAttribute('placeholder'),el.getAttribute('data-testid')]),
              }),{sample}).catch(()=>null);
              stage('details',{details,inference,errors});
            }
          } finally { await browser.close(); }
          NODE
