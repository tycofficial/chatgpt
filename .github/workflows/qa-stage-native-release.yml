name: Compare several real browser Codex response boundaries
on:
  push:
    branches: [qa/codex-public-summary-heading]
permissions:
  contents: read
jobs:
  codex:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      SITE: https://tycofficial.github.io/chatgpt/
      API: https://chatgpt-admin-bridge-tyc.hushedtarragon1.chatgpt.site
      RELEASE: bfb322d68717147e
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Use the site's real Pro trial and stock Codex interface
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pages-browser" --no-audit --no-fund --package-lock=false playwright-core@1.58.2
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash, randomUUID } from 'node:crypto';
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { chromium } = await import(pathToFileURL(join(process.env.RUNNER_TEMP, 'pages-browser/node_modules/playwright-core/index.mjs')).href);
          const { SITE, API, RELEASE } = process.env;
          const home = new URL(SITE), nonce = randomUUID().replace(/-/g, '').slice(0, 10);
          const username = 'qacodex' + nonce, password = 'Qa9codex' + randomUUID().replace(/-/g, '');
          const sample = 'CODEXQA-' + nonce, expected = sample + '-323';
          const query = '请用 Python 工具实际执行 print("' + sample + '-" + str(17 * 19))。执行完后回复实际输出。';
          const continuation = '请回复上一次实际 Python 输出的完整第一行，并追加 -NEXT。只输出这一行。';
          const stage = (name, detail) => console.log('Codex QA ' + name + (detail === undefined ? '' : ' ' + JSON.stringify(detail)));
          async function post(path, data, token) {
            const result = await fetch(API + path, { method:'POST',
              headers: { Origin: home.origin, 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
              body: JSON.stringify(data), signal: AbortSignal.timeout(22000) });
            assert.equal(result.status, 200, path + ' refused the QA account operation');
            return result.json();
          }
          const active = await fetch(new URL('native-client/active.json?codex_qa=' + RELEASE, home), { signal: AbortSignal.timeout(18000) });
          assert.equal((await active.json()).release, RELEASE);
          const assigned = await post('/auth/register', { username, password });
          assert.equal(assigned.user?.planType, 'free');
          const trial = await post('/auth/site-trial', { tier:'pro' }, assigned.token);
          assert.equal(trial.user?.planType, 'pro');
          assert.equal(trial.user?.siteTrial?.tier, 'pro');
          stage('activated-a-normal-site-pro-trial');

          const itemHash = id => id ? createHash('sha256').update(id).digest('hex').slice(0, 7) : null;
          const texts = new Map();
          const patches = [];
          const inspect = (source, index, part, text, append) => {
            if (typeof text !== 'string') text = '';
            const key = index + ':' + part;
            const old = texts.get(key) ?? '';
            const next = append ? old + text : text;
            if (!next.startsWith(old)) {
              let common = 0;
              while (common < next.length && common < old.length && next[common] === old[common]) common++;
              patches.push({ source, index, part, oldLength:old.length, newLength:next.length, common, beforeWhitespace:old.length - old.trim().length, afterWhitespace:next.length - next.trim().length });
            }
            texts.set(key, next);
          };
          async function traceReceipt(token, id) {
            if (!id) return console.log('Codex receipt unavailable');
            let after = -1, status = null, incoming = '', state;
            const all = [];
            for (let round = 0; round < 48; round++) {
              const reply = await fetch(API + '/inference/v1/responses/' + id + '?after=' + after, {
                signal:AbortSignal.timeout(10000), headers:{Origin:home.origin, Authorization:'Bearer ' + token},
              });
              if (!reply.ok) {
                if (reply.status === 404) { await new Promise(r=>setTimeout(r,500)); continue; }
                console.log('Codex receipt HTTP ' + reply.status); break;
              }
              const receipt = await reply.json();
              status = receipt.status; state = receipt.error?.code;
              for (const chunk of receipt.chunks) { after = chunk.seq; incoming += chunk.data; }
              let end;
              while ((end = /\r?\n\r?\n/.exec(incoming))) {
                const value = incoming.slice(0,end.index).split(/\r?\n/).filter(v=>v.startsWith('data:')).map(v=>v.slice(5).trimStart()).join('\n');
                incoming = incoming.slice(end.index+end[0].length);
                if (!value) continue;
                if (value==='[DONE]') { all.push({type:'[DONE]'}); continue; }
                try { all.push(JSON.parse(value)); } catch {}
              }
              if (!receipt.hasMore && status !== 'running') break;
              if (!receipt.hasMore || !receipt.chunks.length) await new Promise(r=>setTimeout(r,550));
            }
            const events = [], indexes = new Map(), statusCounts = {};
            const describe = item => ({ type:item?.type, phase:item?.phase, id:itemHash(item?.id), status:item?.status,
              content:item?.content?.map(p=>({ type:p.type, size:p.text?.length ?? null, keys:Object.keys(p) })) });
            for (const e of all) {
              if (!e.type) continue;
              statusCounts[e.type]=(statusCounts[e.type] ?? 0)+1;
              const index = e.output_index ?? indexes.get(e.item_id) ?? 0;
              if (e.type === 'response.output_text.delta' || e.type === 'response.output_text.done') {
                inspect(e.type, index, e.content_index ?? 0, e.delta ?? e.text, e.type.endsWith('.delta'));
                if (e.type.endsWith('.done')) events.push({ type:e.type,index,id:itemHash(e.item_id),size:e.text?.length ?? null, keys:Object.keys(e) });
              }
              if (e.type.startsWith('response.output_item')) {
                if (e.item?.id) indexes.set(e.item.id,index);
                events.push({type:e.type,index,item:describe(e.item)});
                for (const [i,p] of (e.item?.content ?? []).entries()) {
                  if (p.type==='output_text') inspect(e.type,index,i,p.text,false);
                }
              } else if ((e.type==='response.completed' || e.type==='response.incomplete') && Array.isArray(e.response?.output)) {
                events.push({type:e.type,items:e.response.output.map(describe)});
                for (const [at,item] of e.response.output.entries()) {
                  for (const [i,p] of (item.content ?? []).entries()) {
                    if (p.type==='output_text') inspect(e.type,at,i,p.text,false);
                  }
                }
              }
            }
            console.log('Codex receipt transitions ' + JSON.stringify({ status,state,output:statusCounts,events,patches }));
          }

          const creationCount = 3;
          const browser = await chromium.launch({ channel: 'msedge', headless: true });
          const known = [];
          try {
            for (let run = 0; run < creationCount; run++) {
              const context = await browser.newContext({ locale:'zh-CN' });
              try {
                const page = await context.newPage();
                const firstPrompt = run === 0 ? query : '先在对话里简短说明会做什么，再真正调用工具。' + query + ' 新检查 ' + run + '。';
                const isModel = r => r.method()==='POST'&&r.url()===API+'/inference/v1/responses';
                await page.goto(new URL('auth/login/',home).href,{waitUntil:'domcontentloaded',timeout:40000});
                await page.locator('#site-username').fill(username);
                await page.locator('#site-password').fill(password);
                const [reply] = await Promise.all([
                  page.waitForResponse(r=>r.url()===API+'/auth/login'&&r.request().method()==='POST',{timeout:35000}),
                  page.getByRole('button',{name:'继续',exact:true}).click(),
                ]);
                assert.equal(reply.status(),200);
                await page.waitForURL(url=>url.origin===home.origin&&url.pathname===home.pathname,{timeout:40000});
                await page.waitForFunction(release=>window.__CHATGPT_REPLICA_ENV__?.release===release, RELEASE,{timeout:30000});
                const next = page.getByRole('button',{name:/^(?:探索|Explore)$/i}).filter({visible:true}).first();
                await next.click({timeout:30000});
                await page.getByRole('button',{name:/^Codex$/i}).or(page.getByRole('link',{name:/^Codex$/i})).or(page.getByRole('menuitem',{name:/^Codex$/i})).or(page.getByRole('tab',{name:/^Codex$/i})).filter({visible:true}).first().click({timeout:16000});
                await page.waitForFunction(() => history.state?.usr?.sidebarProductMode==='codex', undefined, {timeout:16000});
                const composer = page.locator('main #prompt-textarea[contenteditable="true"], main .ProseMirror[contenteditable="true"], main textarea:not([disabled]), [data-testid="codex-composer"] [contenteditable="true"], textarea:not([disabled]), [role="textbox"][contenteditable="true"]').filter({visible:true}).first();
                await composer.click({timeout:28000});
                await page.keyboard.insertText(firstPrompt);
                const button = page.locator('#composer-submit-button, button[data-testid="send-button"], button[data-testid="composer-submit-button"], button[aria-label="发送"], button[aria-label="发送消息"], button[aria-label="发送提示"], button[aria-label="Send message"], button[aria-label="Send prompt"]').filter({visible:true}).first();
                const [sent] = await Promise.all([page.waitForRequest(isModel,{timeout:48000}),await button.isVisible() && await button.isEnabled() ? button.click() : composer.press('Enter')]);
                await traceReceipt(assigned.token,sent.headers()['x-chat-request-id']);
                const madeProgress = await page.waitForFunction(() => {
                  if (document.body?.innerText?.includes('Gateway replaced already streamed assistant text')) return 'prefix-error';
                  for (const key of Object.keys(localStorage).filter(k=>k.includes('cg-original-app-server:v1:account:'))) {
                    for (const thread of JSON.parse(localStorage.getItem(key)).threads) {
                      if (location.pathname.split('/').filter(Boolean).at(-1)!==thread.id) continue;
                      const turn=thread.turns.at(-1);
                      if (turn?.items.some(item=>item.type==='mcpToolCall'&&item.tool==='python')) return 'python-tool';
                      if (['failed','interrupted'].includes(turn?.status)) return turn.status;
                    }
                  }
                  return null;
                },undefined,{timeout:22000}).then(handle=>handle.jsonValue()).catch(()=>null);
                known.push({run,madeProgress});
                console.log('Codex production projection ' + JSON.stringify({ run,madeProgress }));
              } catch (error) {
                console.log('Codex trace control ' + JSON.stringify({run,error:error.name,message:error.message.slice(0,170)}));
              } finally { await context.close(); }
              if (known.at(-1)?.madeProgress==='prefix-error') break;
            }
          } finally { await browser.close(); }
          NODE
