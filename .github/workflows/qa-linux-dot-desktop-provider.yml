name: Verify private Linux Dot desktop provider
on:
  push:
    branches: [qa/dot-strict-ubuntu26-423b58c]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install the Linux test runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libx11-6 libxtst6 bubblewrap python3
      - name: Check source syntax and exercise private desktop behavior
        env:
          QA_REQUIRE_DOT_SANDBOX: '1'
        run: |
          node --check dot-desktop-provider/index.mjs
          node --check dot-desktop-provider/linux-desktop.mjs
          /usr/bin/python3 -c 'from pathlib import Path; compile(Path("dot-desktop-provider/x11.py").read_bytes(), "x11.py", "exec")'
          node --test dot-desktop-provider/*.test.mjs
