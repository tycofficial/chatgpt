name: Verify Dot account and Read Aloud against both native archives
on:
  push:
    branches: [qa/sync-0237-dot-audio]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: windows-2025
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    env:
      UPSTREAM: 0237c4dd9e54c7e3a619581b909d792de582fee9
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: chatgpt-verified-public-graph-0237c4dd
          path: ${{ runner.temp }}/chatgpt-candidate-archive
          github-token: ${{ github.token }}
          run-id: 45152117130
      - name: Unpack the already verified capture on this runner
        run: |
          set -euo pipefail
          task_tmp="$(cygpath -u "$RUNNER_TEMP")"
          mkdir -p "$task_tmp/chatgpt-upstream-capture"
          tar -C "$task_tmp/chatgpt-upstream-capture" -xzf "$task_tmp/chatgpt-candidate-archive/chatgpt-upstream.tar.gz"
          npm ci --no-audit --no-fund
      - name: Verify original Dot and Read Aloud in the published b634 archive
        run: node --test tests/native-dot.test.mjs tests/native-read-aloud-original-abi.test.mjs
      - name: Build the isolated 0237 candidate
        run: |
          set -euo pipefail
          node scripts/adopt-native-upstream.mjs "$RUNNER_TEMP/chatgpt-upstream-capture/$UPSTREAM"
          node scripts/build-native-client.mjs --activate
          npm run native:check
          node -e 'console.log("Candidate release " + JSON.stringify(require("./native-client/active.json")))'
      - name: Verify original Dot and Read Aloud in the current 0237 archive
        run: node --test tests/native-dot.test.mjs tests/native-read-aloud-original-abi.test.mjs
