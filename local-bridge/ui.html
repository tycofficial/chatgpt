<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TYC 本机 ChatGPT 桥接</title><link rel="stylesheet" href="/style.css"></head><body><main>
<h1>本机 ChatGPT 桥接</h1><p>电脑在线时，通过你明确授权的 ChatGPT 计划处理已配对网站的请求。OAuth 凭证只保存在本机受保护文件中。</p>
<section><h2>1. 配对本站管理员</h2><p>这是本站账号，不是 OpenAI 或 Google 的登录密码。</p><form id="pair"><label>管理员用户名<input name="username" autocomplete="username" required></label><label>本站管理员密码<input name="password" type="password" autocomplete="off" required></label><button>配对本站</button></form><p id="paired"></p></section>
<section><h2>2. 选择并授权 ChatGPT 账号</h2><label>已保存注册<select id="accounts"><option value="">添加新 ChatGPT 账号</option></select></label><div class="actions"><button id="signin" data-oai-siwc-button>Continue with ChatGPT</button><button id="enable">授权使用 ChatGPT 计划</button><button id="select">使用所选账号</button><button id="signout">退出所选 ChatGPT 注册</button></div><p id="account-status"></p><p>计划类型与剩余额度尚未由公开接口核验。本站管理员 Pro 权限与官方 ChatGPT 订阅是两种信息。</p><a href="https://chatgpt.com/settings/usage" target="_blank" rel="noreferrer">打开 ChatGPT Settings → Usage</a><p><button id="quota">我已检查用量，允许再次尝试</button></p></section>
<section><h2>3. 处理网站任务</h2><div class="actions"><button id="start">开始接收任务</button><button id="stop">停止接收与当前请求</button></div><p id="running"></p><p id="job"></p><p>中断后会保存事件检查点；未确认完成的请求不会因重启而自动重复提交。关闭本机程序或电脑离线后，本桥接不会继续推理。</p></section>
<p role="status" id="status"></p></main><script type="module" src="/client.js"></script></body></html>
