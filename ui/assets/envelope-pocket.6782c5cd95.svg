  <defs>
    <linearGradient id="front" x1="0" y1="0" x2=".25" y2="1"><stop stop-color="#faf9f5"/><stop offset="1" stop-color="#efede6"/></linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fbfaf7"/><stop offset="1" stop-color="#f4f2ec"/></linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" seed="8" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
